try { var t = JSON.parse(localStorage.getItem('atalaya:prefs') || '{}').tema; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/*@@FUENTES@@*/

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 120ms; --t: 200ms; --t-slow: 320ms;
  --sidebar: 248px;
}
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1020; --bg-glow: rgba(34, 211, 238, .07); --bg-glow-2: rgba(139, 124, 246, .05);
  --surface: #111827; --surface-2: #172033; --surface-3: #1E2A42; --surface-hover: #151F33;
  --line: #1E293D; --line-2: #2A3854; --line-3: #3A4A6A;
  --text: #F3F6FA; --text-2: #A3B0C5; --text-3: #6B7A93; --text-4: #4A5874;
  --accent: #22D3EE; --accent-ink: #0B1020; --accent-soft: rgba(34, 211, 238, .14); --accent-line: rgba(34, 211, 238, .45);
  --blue: #60A5FA;
  --mint: #34D399; --coral: #FB7185; --violet: #A78BFA; --slate: #7C8BA1; --amber: #FBBF24;
  --mint-soft: rgba(52, 211, 153, .14); --coral-soft: rgba(251, 113, 133, .14); --violet-soft: rgba(167, 139, 250, .14);
  --slate-soft: rgba(124, 139, 161, .16); --amber-soft: rgba(251, 191, 36, .13);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -12px rgba(0, 0, 0, .55);
  --shadow-drawer: -30px 0 80px -20px rgba(0, 0, 0, .7);
  --scrim: rgba(5, 8, 18, .55);
  --heat-0: #172033; --heat-1: rgba(34, 211, 238, .35); --heat-2: rgba(34, 211, 238, .65); --heat-3: #22D3EE;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F4F6FA; --bg-glow: rgba(8, 145, 178, .07); --bg-glow-2: rgba(124, 58, 237, .04);
  --surface: #FFFFFF; --surface-2: #F1F4F9; --surface-3: #E6EBF3; --surface-hover: #F7F9FC;
  --line: #E4E9F0; --line-2: #D5DCE7; --line-3: #B8C2D3;
  --text: #0B1220; --text-2: #4A5568; --text-3: #7D889B; --text-4: #A7B0BF;
  --accent: #0891B2; --accent-ink: #FFFFFF; --accent-soft: rgba(8, 145, 178, .10); --accent-line: rgba(8, 145, 178, .45);
  --blue: #2563EB;
  --mint: #059669; --coral: #E11D48; --violet: #7C3AED; --slate: #64748B; --amber: #D97706;
  --mint-soft: rgba(5, 150, 105, .10); --coral-soft: rgba(225, 29, 72, .09); --violet-soft: rgba(124, 58, 237, .09);
  --slate-soft: rgba(100, 116, 139, .12); --amber-soft: rgba(217, 119, 6, .10);
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px -12px rgba(15, 23, 42, .14);
  --shadow-drawer: -24px 0 60px -20px rgba(15, 23, 42, .22);
  --scrim: rgba(15, 23, 42, .22);
  --heat-0: #E9EEF5; --heat-1: rgba(8, 145, 178, .30); --heat-2: rgba(8, 145, 178, .60); --heat-3: #0891B2;
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: 13.5px; line-height: 1.5;
  color: var(--text); background: var(--bg);
  background-image: radial-gradient(900px 380px at 12% -8%, var(--bg-glow), transparent 70%),
                    radial-gradient(700px 300px at 92% -10%, var(--bg-glow-2), transparent 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01', 'cv11';
}
html.theme-anim, html.theme-anim * { transition: background-color var(--t-slow) var(--ease), border-color var(--t-slow) var(--ease), color var(--t-slow) var(--ease), fill var(--t-slow) var(--ease) !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ico.sm { width: 13px; height: 13px; } .ico.xs { width: 11px; height: 11px; stroke-width: 2.2; } .ico.lg { width: 20px; height: 20px; }
.mono { font-family: var(--mono); font-feature-settings: 'zero'; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px var(--accent-line); padding: 0 1px; }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.kbd { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; line-height: 16px; }

/* Procedencia del dato */
.src-inferido { text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }
.src-ausente { color: var(--text-3); font-style: italic; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px;
  height: 56px; padding: 0 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(140%);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: calc(var(--sidebar) - 22px); }
.brand-mark { width: 26px; height: 26px; color: var(--accent); }
.brand-name { font-weight: 650; letter-spacing: .22em; font-size: 13px; }
.brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; }
.views { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.views button { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 7px; color: var(--text-2); font-weight: 500; transition: color var(--t-fast), background var(--t-fast); }
.views button:hover { color: var(--text); background: var(--surface-2); }
.views button[aria-selected="true"] { color: var(--text); background: var(--surface-3); box-shadow: 0 0 0 1px var(--line-2) inset; }
.views button[aria-selected="true"] .ico { color: var(--accent); }
.views .k { font-family: var(--mono); font-size: 10px; color: var(--text-4); }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input {
  width: 100%; height: 34px; padding: 0 64px 0 34px; border-radius: 9px; border: 1px solid var(--line-2);
  background: var(--surface); outline: none; transition: border-color var(--t), box-shadow var(--t);
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft); }
.search > .ico { position: absolute; left: 11px; top: 9px; color: var(--text-3); }
.search .kbd { position: absolute; right: 10px; top: 8px; }
.search .clear { position: absolute; right: 8px; top: 7px; display: none; color: var(--text-3); padding: 2px; border-radius: 5px; }
.search.has-q .clear { display: block; } .search.has-q .kbd { display: none; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.stamp { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.stamp .tag-demo { color: var(--violet); border: 1px solid color-mix(in srgb, var(--violet) 40%, transparent); background: var(--violet-soft); border-radius: 5px; padding: 1px 6px; letter-spacing: .06em; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); transition: color var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
.icon-btn:hover { color: var(--text); border-color: var(--line-3); }
.icon-btn:active { transform: scale(.94); }
.icon-btn .i-moon { display: none; } :root[data-theme="light"] .icon-btn .i-sun { display: none; } :root[data-theme="light"] .icon-btn .i-moon { display: block; }

.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); align-items: start; }
.main { min-width: 0; padding: 0 22px 60px 22px; }

/* ============================================================
   OVERVIEW (cabecera editorial)
   ============================================================ */
.overview { display: grid; grid-template-columns: minmax(300px, 1.1fr) minmax(360px, 1.6fr) minmax(280px, 1fr); gap: 0; margin: 18px 22px 6px; border: 1px solid var(--line); border-radius: var(--r-lg); background: color-mix(in srgb, var(--surface) 70%, transparent); overflow: hidden; }
.ov-block { padding: 18px 20px 16px; min-width: 0; }
.ov-block + .ov-block { border-left: 1px solid var(--line); }
.ov-total { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 12px; }
.ov-total b { font-size: 46px; line-height: 1; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ov-total span { font-size: 15px; color: var(--text-2); }
.pulse-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.pl-chip { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px 0 7px; border-radius: 7px; border: 1px solid transparent; color: var(--text-2); transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast); }
.pl-chip:hover { background: var(--surface-2); color: var(--text); }
.pl-chip[aria-pressed="true"] { background: var(--surface-3); border-color: var(--line-2); color: var(--text); }
.pl-chip b { font-family: var(--mono); font-weight: 600; color: var(--text); }
.pl-chip.zero { opacity: .45; }
.fase-dist { margin-top: 14px; }
.fase-dist .bar { display: flex; gap: 2px; height: 8px; margin: 6px 0 6px; }
.fase-dist .seg { border-radius: 2px; background: var(--accent); opacity: .25; transition: opacity var(--t); min-width: 3px; }
.fase-dist .seg:hover { opacity: 1; }
.fase-dist .seg.f-unknown { background: transparent; box-shadow: inset 0 0 0 1px var(--line-3); opacity: 1; }
.fase-dist .lbls { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--text-3); }
.fase-dist .lbls b { color: var(--text-2); font-family: var(--mono); font-weight: 500; }

.skyline-wrap { position: relative; height: 128px; margin-top: 8px; }
.skyline { display: flex; align-items: flex-end; gap: 6px; height: 104px; padding: 0 2px; border-bottom: 1px solid var(--line-2); }
.sky-bar { position: relative; flex: 1; min-width: 10px; max-width: 40px; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
.sky-bar .fill { animation: grow 700ms var(--ease) both; animation-delay: calc(var(--k, 0) * 30ms); width: 100%; border-radius: 4px 4px 1px 1px; background: var(--c); opacity: .78; transform-origin: bottom; transition: opacity var(--t-fast), transform var(--t-slow) var(--ease); }
.sky-bar.none .fill { background: repeating-linear-gradient(135deg, var(--line-3) 0 2px, transparent 2px 5px); opacity: .9; }
.sky-bar:hover .fill, .sky-bar:focus-visible .fill { opacity: 1; }
.sky-bar.dim .fill { opacity: .14; }
.sky-bar .cap { position: absolute; left: 50%; bottom: calc(var(--h) + 4px); transform: translateX(-50%); }
.sky-axis { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 10px; color: var(--text-4); }
.attn-list { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.attn-item { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; text-align: left; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; transition: background var(--t-fast); }
.attn-item:hover { background: var(--surface-2); }
.attn-item .t { font-weight: 550; font-size: 13px; }
.attn-item .s { font-size: 11.5px; color: var(--text-3); }
.attn-empty { color: var(--text-3); font-size: 12.5px; margin-top: 10px; }

/* ============================================================
   SIDEBAR (filtros)
   ============================================================ */
.sidebar { position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow: auto; padding: 18px 14px 40px 22px; scrollbar-width: thin; }
.facet { margin-bottom: 18px; }
.facet h3 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.facet-opt { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; height: 27px; padding: 0 8px 0 6px; border-radius: 7px; color: var(--text-2); text-align: left; transition: background var(--t-fast), color var(--t-fast); }
.facet-opt:hover { background: var(--surface-2); color: var(--text); }
.facet-opt[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.facet-opt .n { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.facet-opt.zero { opacity: .4; }
.facet-opt .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet .more { font-size: 11.5px; color: var(--text-3); padding: 4px 6px; }
.facet .more:hover { color: var(--accent); }
.box { width: 12px; height: 12px; border-radius: 3.5px; border: 1.5px solid var(--line-3); display: inline-grid; place-items: center; transition: background var(--t-fast), border-color var(--t-fast); }
.facet-opt[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.facet-opt[aria-pressed="true"] .box::after { content: ''; width: 5px; height: 3px; border: 1.6px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.side-foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-3); line-height: 1.7; }
.side-foot .kbd { margin-right: 4px; }

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar { position: sticky; top: 56px; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0 12px; background: linear-gradient(var(--bg) 78%, transparent); }
.toolbar h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.toolbar .count { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.seg-ctl { display: inline-flex; padding: 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.seg-ctl button { height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--text-2); transition: background var(--t-fast), color var(--t-fast); }
.seg-ctl button:hover { color: var(--text); }
.seg-ctl button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.tb-spacer { flex: 1; }
.select { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-3); font-size: 12px; }
.select select { border: 0; background: transparent; color: var(--text); height: 26px; padding-right: 4px; outline: none; cursor: pointer; }
.select select option { background: var(--surface); color: var(--text); }
.link-btn { font-size: 12px; color: var(--text-3); display: inline-flex; gap: 5px; align-items: center; }
.link-btn:hover { color: var(--accent); }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.af { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 9px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 11.5px; }
.af:hover { filter: brightness(1.1); }

/* ============================================================
   GLIFOS COMPARTIDOS
   ============================================================ */
/* Pulso: color + forma (redundancia para daltonismo) */
.pulse { --c: var(--text-3); position: relative; display: inline-grid; place-items: center; width: 12px; height: 12px; flex: none; }
.pulse::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pulse.p-activo { --c: var(--mint); }
.pulse.p-activo::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--c); opacity: .5; animation: ping 2.4s var(--ease) infinite; }
.pulse.p-bloqueado { --c: var(--coral); } .pulse.p-bloqueado::before { border-radius: 2px; width: 8px; height: 8px; transform: rotate(45deg); }
.pulse.p-pausa { --c: var(--violet); } .pulse.p-pausa::before { width: 8px; height: 9px; border-radius: 1px; background: linear-gradient(90deg, var(--c) 0 35%, transparent 35% 65%, var(--c) 65%); }
.pulse.p-cerrado { --c: var(--slate); } .pulse.p-cerrado::before { width: 9px; height: 9px; background: none; border: 2px solid var(--c); }
.pulse.p-desconocido::before { width: 9px; height: 9px; background: none; border: 1.5px dashed var(--text-3); }
.pulse.stale::after { display: none; }
@keyframes ping { 0% { transform: scale(.7); opacity: .6; } 70%, 100% { transform: scale(1.7); opacity: 0; } }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.p-activo { background: var(--mint-soft); color: var(--mint); border-color: transparent; }
.pill.p-bloqueado { background: var(--coral-soft); color: var(--coral); border-color: transparent; }
.pill.p-pausa { background: var(--violet-soft); color: var(--violet); border-color: transparent; }
.pill.p-cerrado { background: var(--slate-soft); color: var(--slate); border-color: transparent; }
.pill.p-desconocido { background: transparent; color: var(--text-3); border-style: dashed; border-color: var(--line-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.tech { font-family: var(--mono); font-size: 10.5px; }
.chip.tag { background: transparent; color: var(--text-3); }
.chip.tag::before { content: '#'; color: var(--text-4); }

/* Escalera de fase */
.steps { display: flex; gap: 2px; align-items: center; }
.steps i { width: 13px; height: 4px; border-radius: 2px; background: var(--surface-3); transition: background var(--t); }
.steps i.on { background: color-mix(in srgb, var(--accent) 45%, var(--surface-3)); }
.steps i.cur { background: var(--accent); box-shadow: 0 0 8px -1px var(--accent); }
.steps.closed i.on, .steps.closed i.cur { background: var(--slate); box-shadow: none; }
.steps.unknown i { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.fase-cell .lbl { display: block; margin-top: 5px; font-size: 11.5px; color: var(--text-2); }
.fase-cell .lbl.none { color: var(--text-3); font-style: italic; }

/* Progreso */
.prog { display: grid; gap: 5px; }
.prog .track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.prog .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 60%, transparent), var(--accent)); transition: width 900ms var(--ease); }
.ready .prog .fill { width: calc(var(--p) * 100%); }
.prog.closed .fill { background: var(--slate); }
.prog .segs { display: flex; gap: 3px; height: 6px; }
.prog .segs i { flex: 1; border-radius: 2px; background: var(--surface-3); transition: background 500ms var(--ease) calc(var(--k) * 90ms); }
.ready .prog .segs i.on { background: var(--accent); }
.prog .segs i.half { background: linear-gradient(90deg, var(--accent) 50%, var(--surface-3) 50%); }
.prog .dash { height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line-2) 0 4px, transparent 4px 7px); }
.prog .meta { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--text-3); }
.prog .meta b { font-family: var(--mono); font-weight: 600; font-size: 12.5px; color: var(--text); font-variant-numeric: tabular-nums; }
.prog .meta .how { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--text-4); text-transform: uppercase; }

/* Actividad (26 semanas) */
.heat { display: flex; gap: 1.5px; align-items: flex-end; height: 18px; }
.heat i { width: 3.5px; height: 18px; border-radius: 1.5px; background: var(--heat-0); }

.act-cell .lbl { display: block; margin-top: 4px; font-size: 11px; color: var(--text-3); }

/* Backlog: una marca por elemento, la intensidad es la prioridad */
.strip { display: flex; gap: 1.5px; align-items: center; height: 16px; overflow: hidden; }

.p-alta { background: var(--accent); } .p-media { background: color-mix(in srgb, var(--accent) 55%, var(--surface-3)); }
.p-baja { background: color-mix(in srgb, var(--accent) 25%, var(--surface-3)); }
.p-sin { background: transparent; box-shadow: inset 0 0 0 1px var(--text-4); }

/* Prioridad: tres barras ascendentes */

.prio.lv1 i:nth-child(-n+1), .prio.lv2 i:nth-child(-n+2), .prio.lv3 i { background: var(--accent); }

/* Senales */

.p-row { position: relative; min-height: 64px; padding-top: 10px; padding-bottom: 10px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); cursor: pointer; outline: none; transition: background var(--t-fast); animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(min(var(--i), 18) * 16ms); }
.p-row::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); transform: scaleY(0); transition: transform var(--t) var(--ease); }

.p-row .name .id { font-family: var(--mono); font-size: 10.5px; color: var(--text-4); white-space: nowrap; }
.p-row .desc { margin-top: 2px; font-size: 12px; color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

.next { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: start; font-size: 12.5px; color: var(--text); }

.todo-cell b { font-family: var(--mono); font-size: 15px; font-weight: 600; }

@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ============================================================
   VISTA PROYECTOS (tarjetas)
   ============================================================ */

.card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; outline: none; overflow: hidden; transition: transform var(--t) var(--ease), border-color var(--t), box-shadow var(--t); animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(min(var(--i), 18) * 22ms); }
.card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--c, var(--line-2)); opacity: .9; }
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--line-2); box-shadow: var(--shadow), 0 0 0 1px var(--line-2); }

.card .c-top { display: flex; align-items: center; gap: 8px; }

/* Anillo de progreso */

/* ============================================================
   VISTA MAPA
   ============================================================ */
.map-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0); background-size: 22px 22px; }

.edge.tec { stroke: var(--text-4); stroke-dasharray: 3 4; stroke-width: 1; opacity: .5; }
.edge.hot { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }

.node:hover .halo, .node.hot .halo { opacity: .28; }
.node.cold { opacity: .18; }

.node.unk .core { stroke-dasharray: 3 3; }

.cat-lbl { fill: var(--text-4); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; text-anchor: middle; }
.map-legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: 11.5px; color: var(--text-2); }
.map-legend .row { display: flex; align-items: center; gap: 8px; }

.toggle { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-2); font-size: 12px; color: var(--text-2); }
.toggle .sw { width: 26px; height: 15px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background var(--t); }
.toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--text-3); transition: transform var(--t) var(--ease), background var(--t); }
.toggle[aria-pressed="true"] .sw { background: var(--accent-soft); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(11px); background: var(--accent); }

/* ============================================================
   DETALLE (drawer)
   ============================================================ */

.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(860px, 94vw); display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-drawer); transform: translateX(104%); transition: transform var(--t-slow) var(--ease); }

.d-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.d-head h2 { margin: 6px 0 6px; font-size: 30px; line-height: 1.12; font-weight: 600; letter-spacing: -.03em; }
.d-head .desc { margin: 0 0 14px; font-size: 14.5px; color: var(--text-2); max-width: 60ch; }
.d-head .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.d-head .upd { margin-top: 12px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); }
.d-head .ring-big { text-align: center; }
.d-head .ring-big .how { margin-top: 2px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.journey { margin-top: 22px; display: grid; grid-template-columns: repeat(7, 1fr); position: relative; }

.hero-next { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 16px; padding: 20px 22px; border-radius: var(--r-lg); background: linear-gradient(120deg, var(--accent-soft), transparent 60%), var(--surface); border: 1px solid var(--accent-line); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 6%, transparent), var(--shadow); }
.hero-next .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); }

.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.sec-h h3 { margin: 0; font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; font-weight: 600; text-transform: uppercase; }
.sec-h .n { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }

.tiles { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
.tile { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }

.act-chart { display: flex; gap: 3px; align-items: flex-end; height: 54px; margin-top: 4px; }

.sig-list { display: grid; gap: 8px; }

/* AHORA: lista de verificacion */
.todo-list { display: grid; gap: 2px; }
.todo-it { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.todo-it + .todo-it { margin-top: 4px; }
.todo-it .cb { width: 16px; height: 16px; margin-top: 2px; border-radius: 4.5px; border: 1.6px solid var(--line-3); display: grid; place-items: center; }
.todo-it.en_curso .cb { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.todo-it.bloqueado { border-color: color-mix(in srgb, var(--coral) 35%, var(--line)); }
.todo-it.bloqueado .cb { border-color: var(--coral); color: var(--coral); }
.todo-it.hecho { background: transparent; border-color: transparent; color: var(--text-3); }
.todo-it.hecho .cb { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.todo-it.hecho .t { text-decoration: line-through; text-decoration-color: var(--text-4); }
.todo-it .t { font-size: 13.5px; }
.todo-it .st { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-left: 6px; }
.todo-it.bloqueado .st { color: var(--coral); }
.todo-it .meta { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--text-4); white-space: nowrap; padding-top: 2px; }
.done-toggle { margin-top: 8px; font-size: 12px; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; }
.done-toggle:hover { color: var(--accent); }

/* BACKLOG: reserva, no lista de tareas */
.bl-sum { display: grid; grid-template-columns: auto 1fr 1fr; gap: 22px; align-items: start; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
.bl-sum .big { font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.bl-sum .big small { display: block; margin-top: 6px; font-size: 10.5px; font-weight: 400; letter-spacing: .06em; color: var(--text-3); text-transform: uppercase; }
.bars { display: grid; gap: 6px; }
.bars .b { display: grid; grid-template-columns: 92px 1fr 26px; gap: 10px; align-items: center; font-size: 11.5px; color: var(--text-2); }
.bars .b .tr { height: 8px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bars .b .tr i { display: block; height: 100%; border-radius: 2px; width: 0; transition: width 800ms var(--ease); }
.ready .bars .b .tr i { width: calc(var(--p) * 100%); }
.bars .b .v { font-family: var(--mono); text-align: right; color: var(--text); }
.bl-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.bl-cat { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; color: var(--text-2); transition: all var(--t-fast); }
.bl-cat b { font-family: var(--mono); font-weight: 500; color: var(--text-3); }
.bl-cat:hover { border-color: var(--line-3); color: var(--text); }
.bl-cat[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.bl-cat[aria-pressed="true"] b { color: var(--bg); opacity: .7; }
.bl-grid { columns: 2 260px; column-gap: 26px; }
.bl-group { break-inside: avoid; margin-bottom: 14px; }
.bl-group h5 { margin: 0 0 6px; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.bl-it { display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 3px 0; font-size: 12.5px; color: var(--text-2); }
.bl-it .o { width: 9px; height: 9px; margin-top: 4.5px; border-radius: 50%; border: 1.5px solid var(--text-4); }
.bl-it .o.p-alta { border-color: var(--accent); background: var(--accent); }
.bl-it .o.p-media { border-color: var(--accent); background: transparent; }
.bl-it .o.p-baja { border-color: color-mix(in srgb, var(--accent) 45%, var(--surface-3)); }
.bl-it.alta { color: var(--text); }
.bl-more { margin-top: 4px; font-size: 12px; color: var(--accent); }

/* ROADMAP */
.road { display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
.phase { position: relative; flex: 0 0 196px; padding: 26px 14px 0 0; }
.phase::before { content: ''; position: absolute; left: 8px; right: 0; top: 7px; height: 2px; background: var(--line-2); }
.phase:last-child::before { right: auto; width: 0; }
.phase.hecho::before { background: var(--accent); }
.phase.en_curso::before { background: linear-gradient(90deg, var(--accent), var(--line-2)); }
.phase .nd { position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-3); background: var(--bg); }
.phase.hecho .nd { border-color: var(--accent); background: var(--accent); }
.phase.en_curso .nd { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.phase.en_curso .nd::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); animation: breathe 2s var(--ease) infinite; }
.phase.vencido .nd { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
.phase.vencido .nd::after { background: var(--amber); }
@keyframes breathe { 50% { opacity: .35; } }
.phase .ph-n { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--text-4); text-transform: uppercase; }
.phase h5 { margin: 2px 0 2px; font-size: 13.5px; font-weight: 600; }
.phase .when { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.phase .when.late { color: var(--amber); }
.phase ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 11.5px; color: var(--text-2); }
.phase li { display: grid; grid-template-columns: 12px 1fr; gap: 5px; }
.phase li .ico { margin-top: 2px; }
.phase li.hecho { color: var(--text-3); }
.phase li.hecho .ico { color: var(--accent); }
.phase.pendiente h5 { color: var(--text-2); }

/* HISTORIAL */
.hist { position: relative; display: grid; gap: 2px; }
.hist::before { content: ''; position: absolute; left: 95px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.hist-it { display: grid; grid-template-columns: 84px 22px 1fr; align-items: start; gap: 0; padding: 4px 0; font-size: 12.5px; }
.hist-it .d { font-family: var(--mono); font-size: 11px; color: var(--text-3); padding-top: 1px; }
.hist-it .dot { width: 9px; height: 9px; margin: 5px 0 0 7px; border-radius: 50%; background: var(--bg); border: 2px solid var(--text-4); position: relative; z-index: 1; }
.hist-it.version .dot { border-color: var(--accent); background: var(--accent); }
.hist-it .k { font-family: var(--mono); font-size: 10px; color: var(--text-4); margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }

/* DOCUMENTOS */
.doc-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 0; }
.doc-tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.doc-tab:hover { color: var(--text); }
.doc-tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--text); }
.doc-panel { border: 1px solid var(--line); border-radius: 0 var(--r) var(--r) var(--r); background: var(--surface); }
.doc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--text-3); }
.doc-meta .chip { font-family: var(--mono); font-size: 10px; }
.md { padding: 6px 22px 18px; font-size: 13.5px; line-height: 1.65; color: var(--text-2); max-height: 520px; overflow: auto; }
.md h1, .md h2, .md h3, .md h4 { color: var(--text); letter-spacing: -.01em; line-height: 1.3; margin: 1.2em 0 .4em; }
.md h1 { font-size: 20px; } .md h2 { font-size: 15.5px; } .md h3, .md h4 { font-size: 13.5px; }
.md p { margin: .5em 0; } .md strong { color: var(--text); }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md li.n1 { margin-left: 1.2em; } .md li.n2 { margin-left: 2.4em; }
.md li.ck { list-style: none; position: relative; margin-left: -1.2em; padding-left: 1.5em; }
.md li.ck::before { content: ''; position: absolute; left: 0; top: .45em; width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line-3); }
.md li.ck.ok::before { background: var(--accent); border-color: var(--accent); }
.md li.ck.ok { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }
.md li.ck.wip::before { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.md code { font-family: var(--mono); font-size: .9em; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--text); }
.md pre { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); overflow: auto; }
.md pre code { padding: 0; background: none; }
.md table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: .6em 0; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.md th { color: var(--text); font-weight: 600; background: var(--surface-2); }
.md blockquote { margin: .6em 0; padding: 4px 12px; border-left: 2px solid var(--accent-line); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .md-a { color: var(--accent); }
.fm-tbl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 12px 0 6px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-family: var(--mono); font-size: 11px; }
.fm-tbl dt { color: var(--text-3); } .fm-tbl dd { margin: 0; color: var(--text); }
.d-empty { padding: 16px 18px; border-radius: var(--r); border: 1px dashed var(--line-2); color: var(--text-3); font-size: 12.5px; font-style: italic; display: flex; gap: 10px; align-items: center; }

/* Tooltip */
.tip { position: fixed; z-index: 90; max-width: 300px; padding: 7px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 11.5px; line-height: 1.4; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--t-fast), transform var(--t-fast); box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .5); }
.tip.on { opacity: 1; transform: none; }
.tip b { font-weight: 600; }
.tip .src { display: block; margin-top: 3px; font-family: var(--mono); font-size: 10px; opacity: .65; }

/* ============================================================
   RESPONSIVE (desktop > laptop > tablet)
   ============================================================ */
@media (max-width: 1400px) {
  .pano-row { grid-template-columns: 40px minmax(190px, 1.4fr) 104px 112px minmax(180px, 1.5fr) 48px 116px 66px 60px; }

}

}
@media (max-width: 1100px) {

  .sidebar { display: none; }
  .sidebar.show { display: block; position: fixed; left: 0; top: 56px; bottom: 0; width: 270px; z-index: 35; background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow-drawer); }
  .brand { min-width: 0; } .brand-sub, .stamp .when { display: none; }
  .main { padding: 0 18px 60px; }
  .pano-row { grid-template-columns: 36px minmax(190px, 1.5fr) 104px 112px minmax(160px, 1.4fr) 48px 66px; }
  .pano-row .c-bl, .pano-row .c-last { display: none; }
  .filters-btn { display: grid !important; }
  .views .k { display: none; }
}
@media (max-width: 860px) {
  .overview { grid-template-columns: 1fr; } .ov-block + .ov-block { border-left: 0; border-top: 1px solid var(--line); }
  .pano-row { grid-template-columns: 36px minmax(160px, 1fr) 104px 60px; }
  .pano-row .c-fase, .pano-row .c-next, .pano-row .c-sig { display: none; }
  .tiles, .bl-sum { grid-template-columns: 1fr; }
  .views button span { display: none; }
}
.filters-btn { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}
</style>

     DATA: dataset generado por R (39_atalaya_generar.R). Reemplazable.
     ============================================================ -->
<script type="application/json" id="atalaya-datos">@@DATOS@@</script>

<script>
(() => {
'use strict';

/* ============================================================
   DATA
   ============================================================ */
const DATA = JSON.parse(document.getElementById('atalaya-datos').textContent);

/* ============================================================
   LOGIC (puro: sin DOM)
   ============================================================ */
const TAX = DATA.taxonomias;
const PULSOS = TAX.pulso;
const PULSO = Object.fromEntries(PULSOS.map(p => [p.id, p]));
const FASES = TAX.fase.map(f => f.id);
const FASE_LBL = Object.fromEntries(TAX.fase.map(f => [f.id, f.etiqueta]));
const CAT_ITEM = Object.fromEntries(TAX.categoria_item.map(c => [c.id, c.etiqueta]));
const PRIO_LBL = { alta: 'Alta', media: 'Media', baja: 'Baja', sin: 'Sin prioridad' };
const PRIO_ORD = { alta: 0, media: 1, baja: 2, sin: 3 };
const SEV_ORD = { atencion: 0, aviso: 1, info: 2 };
const REF = new Date(DATA.fecha_ref + 'T12:00:00');
const DAY = 864e5;

const val = c => (c && c.valor != null ? c.valor : null);
const norm = s => (s == null ? '' : String(s)).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fecha = s => new Date(s + 'T12:00:00');
const diasDesde = s => (s ? Math.round((REF - fecha(s)) / DAY) : null);
const nivelDe = it => (it.prioridad && it.prioridad.nivel) || 'sin';
const abierto = it => ['pendiente', 'en_curso', 'bloqueado'].includes(it.estado);

function modelo(p) {
  const items = p.items || [];
  const inm = items.filter(i => i.horizonte === 'inmediato');
  const fut = items.filter(i => i.horizonte === 'futuro');
  const senales = [...(p.senales || [])].sort((a, b) => SEV_ORD[a.severidad] - SEV_ORD[b.severidad]);
  const pulso = val(p.pulso) || 'desconocido';
  const fase = val(p.fase);
  const tecs = (p.tecnologias && p.tecnologias.valores) || [];
  const docsTxt = (p.documentos || []).map(d => d.texto).join(' ');
  return {
    raw: p, id: p.id,
    nombre: val(p.nombre) || p.id,
    desc: val(p.descripcion),
    pulso, fase, faseIdx: fase ? FASES.indexOf(fase) : -1,
    categoria: val(p.categoria),
    prioridad: val(p.prioridad),
    tecs, tags: p.tags || [],
    ult: val(p.ultima_actividad),
    dias: diasDesde(val(p.ultima_actividad)),
    avance: p.avance,
    avanceNum: p.avance && p.avance.valor != null ? p.avance.valor : null,
    inm, fut,
    inmAb: inm.filter(abierto), futAb: fut.filter(abierto),
    senales,
    sevMax: senales.length ? SEV_ORD[senales[0].severidad] : 9,
    act: p.actividad || [],
    act12: (p.actividad || []).slice(-12).reduce((a, b) => a + b, 0),
    sinFechas: !(p.eventos && p.eventos.length) && !val(p.ultima_actividad),
    idx: {
      'Nombre': norm(val(p.nombre) + ' ' + p.id),
      'Descripción': norm(val(p.descripcion)),
      'Tecnologías': norm(tecs.join(' ')),
      'Tags': norm((p.tags || []).join(' ') + ' ' + (val(p.categoria) || '')),
      'Estado': norm([PULSO[pulso].etiqueta, fase ? FASE_LBL[fase] : '', val(p.resumen)].join(' ')),
      'Ahora': norm(inm.map(i => i.texto).join(' ') + ' ' + (val(p.proximo_paso) || '')),
      'Backlog': norm(fut.map(i => i.texto).join(' ')),
      'Roadmap': norm((p.hitos || []).map(h => h.nombre + ' ' + h.items.map(i => i.texto).join(' ')).join(' ')),
      'Documentos': norm(docsTxt)
    }
  };
}
const PROY = DATA.proyectos.map(modelo);
const BY_ID = Object.fromEntries(PROY.map(p => [p.id, p]));

/** Busqueda: todos los terminos deben aparecer; devuelve los campos que coinciden. */
function coincide(p, tokens) {
  if (!tokens.length) return [];
  const hits = new Set();
  for (const t of tokens) {
    let ok = false;
    for (const [campo, txt] of Object.entries(p.idx)) if (txt.includes(t)) { hits.add(campo); ok = true; }
    if (!ok) return null;
  }
  return [...hits];
}

const FACETAS = {
  pulso:      { titulo: 'Estado',     de: p => [p.pulso] },
  fase:       { titulo: 'Fase',       de: p => [p.fase || 'sin_fase'] },
  categoria:  { titulo: 'Categoría',  de: p => [p.categoria || 'sin_categoria'] },
  tecnologia: { titulo: 'Tecnología', de: p => p.tecs.length ? p.tecs : ['sin_dato'] },
  prioridad:  { titulo: 'Prioridad',  de: p => [p.prioridad || 'sin_dato'] },
  senal:      { titulo: 'Señales',    de: p => p.senales.length ? [...new Set(p.senales.map(s => s.severidad))] : ['ninguna'] }
};
const ETIQ_FACETA = {
  sin_fase: 'Sin fase', sin_categoria: 'Sin categoría', sin_dato: 'Sin dato', ninguna: 'Sin señales',
  atencion: 'Requieren atención', aviso: 'Avisos', info: 'Informativas', alta: 'Alta', media: 'Media', baja: 'Baja'
};
const etiquetaFaceta = (k, v) => k === 'pulso' ? PULSO[v].etiqueta : k === 'fase' && FASE_LBL[v] ? FASE_LBL[v] : (ETIQ_FACETA[v] || v);

function pasa(p, S, excepto) {
  if (S.soloFav && !S.favoritos.includes(p.id)) return false;
  for (const k of Object.keys(FACETAS)) {
    if (k === excepto) continue;
    const sel = S.filtros[k];
    if (sel && sel.length && !FACETAS[k].de(p).some(v => sel.includes(v))) return false;
  }
  return true;
}

const ORDENES = {
  relevancia: { lbl: 'Relevancia', f: (a, b, S) => (S.favoritos.includes(b.id) - S.favoritos.includes(a.id)) || (a.sevMax - b.sevMax) || cmpNull(a.dias, b.dias) },
  nombre:     { lbl: 'Nombre', f: (a, b) => a.nombre.localeCompare(b.nombre, 'es') },
  actividad:  { lbl: 'Actividad reciente', f: (a, b) => cmpNull(a.dias, b.dias) },
  progreso:   { lbl: 'Progreso', f: (a, b) => cmpNull(b.avanceNum, a.avanceNum) },
  prioridad:  { lbl: 'Prioridad', f: (a, b) => cmpNull(PRIO_ORD[a.prioridad], PRIO_ORD[b.prioridad]) },
  pendientes: { lbl: 'Tareas inmediatas', f: (a, b) => b.inmAb.length - a.inmAb.length },
  backlog:    { lbl: 'Tamaño del backlog', f: (a, b) => b.futAb.length - a.futAb.length },
  fase:       { lbl: 'Fase', f: (a, b) => cmpNull(b.faseIdx < 0 ? null : b.faseIdx, a.faseIdx < 0 ? null : a.faseIdx) }
};
/** Los valores sin dato van siempre al final. */
function cmpNull(a, b) {
  const na = a == null, nb = b == null;
  if (na && nb) return 0; if (na) return 1; if (nb) return -1;
  return a < b ? -1 : a > b ? 1 : 0;
}

const AGRUPAR = {
  pulso:     { lbl: 'Estado', clave: p => p.pulso, orden: PULSOS.map(p => p.id), titulo: k => PULSO[k].etiqueta },
  fase:      { lbl: 'Fase', clave: p => p.fase || 'sin_fase', orden: [...FASES].reverse().concat('sin_fase'), titulo: k => FASE_LBL[k] || 'Sin fase' },
  categoria: { lbl: 'Categoría', clave: p => p.categoria || 'Sin categoría', orden: null, titulo: k => k },
  ninguno:   { lbl: 'Sin agrupar', clave: () => '_', orden: ['_'], titulo: () => '' }
};

function consulta(S) {
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  const out = [];
  for (const p of PROY) {
    const hits = coincide(p, tokens);
    if (hits === null) continue;
    if (!pasa(p, S)) continue;
    out.push({ p, hits });
  }
  const f = ORDENES[S.orden].f;
  out.sort((a, b) => f(a.p, b.p, S) || a.p.nombre.localeCompare(b.p.nombre, 'es'));
  return { lista: out, tokens };
}

const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmtFecha = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtCorta = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' });
const fFecha = s => (s ? fmtFecha.format(fecha(s)).replace('.', '') : '');
const fCorta = s => (s ? fmtCorta.format(fecha(s)).replace('.', '') : '');
function relativo(d) {
  if (d == null) return 'sin dato';
  if (d <= 0) return 'hoy'; if (d === 1) return 'ayer';
  if (d < 14) return `hace ${d} d`; if (d < 60) return `hace ${Math.round(d / 7)} sem`;
  if (d < 365) return `hace ${Math.round(d / 30)} meses`;
  const a = Math.round(d / 365); return `hace ${a} año${a > 1 ? 's' : ''}`;
}
/** Resalta terminos sin romper el escapado (norm conserva el largo para texto NFC). */
function hl(text, tokens) {
  if (text == null) return '';
  const s = String(text);
  if (!tokens || !tokens.length) return esc(s);
  const n = norm(s);
  if (n.length !== s.length) return esc(s);
  const marks = [];
  for (const t of tokens) { let i = n.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } }
  if (!marks.length) return esc(s);
  marks.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of marks) { if (a < pos) continue; out += esc(s.slice(pos, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(s.slice(pos));
}
const fuenteTxt = c => {

function backlogStrip(p, max = 30) {

function prio(n) { const lv = { alta: 3, media: 2, baja: 1 }[n] || 0; return `<span class="prio lv${lv}" data-tip="Prioridad: ${esc(PRIO_LBL[n] || 'sin prioridad')}"><i></i><i></i><i></i></span>`; }
const ICONO_SENAL = { bloqueos: 'octagon-x', abandono: 'clock', sin_actividad: 'clock', pausa_prolongada: 'pause', contradiccion_pulso: 'circle-alert',

function ring(p, size = 58) {
  const a = p.avance, r = size / 2 - 5, c = 2 * Math.PI * r, cx = size / 2;
  const closed = p.pulso === 'cerrado' ? ' closed' : '';
  const sw = size > 70 ? 6 : 4.5;
  let inner = '', txt = '', sub = '';
  if (a.tipo === 'declarado') {

    txt = Math.round(a.valor * 100) + '%'; sub = 'declarado';

      inner += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" class="bg" stroke-width="${sw}" stroke-dasharray="${seg} ${c - seg}" stroke-dashoffset="${-(k * (seg + gap))}" transform="rotate(-90 ${cx} ${cx})"/>`;
      if (len) inner += `<circle class="fg" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="butt" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-(k * (seg + gap))}" transform="rotate(-90 ${cx} ${cx})"/>`;

}

function renderSidebar() {

    const cont = new Map();
    for (const p of base) { if (!pasa(p, S, k)) continue; for (const v of fc.de(p)) cont.set(v, (cont.get(v) || 0) + 1); }
    let vals;
    if (k === 'pulso') vals = PULSOS.map(p => p.id);
    else if (k === 'fase') vals = [...FASES, 'sin_fase'];
    else if (k === 'prioridad') vals = ['alta', 'media', 'baja', 'sin_dato'];
    else if (k === 'senal') vals = ['atencion', 'aviso', 'info', 'ninguna'];
    else { const all = new Map(); PROY.forEach(p => fc.de(p).forEach(v => all.set(v, (all.get(v) || 0) + 1))); vals = [...all.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0], 'es')).map(e => e[0]); }
    vals = vals.filter(v => PROY.some(p => fc.de(p).includes(v)));

    }).join('');
    const more = vals.length > limite ? `<button class="more" data-act="vermas" data-k="${k}">+ ${vals.length - limite} más</button>` : '';
    const clr = S.filtros[k].length ? `<button class="link-btn" data-act="clear-facet" data-k="${k}">limpiar</button>` : '';
    html += `<div class="facet"><h3>${fc.titulo}${clr}</h3>${opts}${more}</div>`;
  }
  html += `<div class="facet"><h3>Selección</h3><button class="facet-opt" data-act="solofav" aria-pressed="${S.soloFav}"><span class="box"></span><span class="lbl">Solo favoritos</span><span class="n">${S.favoritos.length}</span></button></div>`;

  $('#sidebar').innerHTML = html;
}

function calcularLayout(conTec) {

  const anchor = Object.fromEntries(cats.map((c, k) => { const a = (k / cats.length) * 2 * Math.PI - Math.PI / 2; return [c, { x: W / 2 + Math.cos(a) * 380, y: H / 2 + Math.sin(a) * 240 }]; }));

      const L = e.tipo === 'referencia' ? 150 : 230, k = e.tipo === 'referencia' ? 0.02 : 0.004;

function bindMapa() {

  };
  nodos.forEach(n => { n.addEventListener('pointerenter', () => foco(n.dataset.node)); n.addEventListener('pointerleave', () => foco(null)); n.addEventListener('focus', () => foco(n.dataset.node)); n.addEventListener('blur', () => foco(null)); });

    aristas.forEach(el => { if (el.dataset.de === drag.p.id || el.dataset.a === drag.p.id) el.setAttribute('d', curva(LAYOUT.pix[el.dataset.de], LAYOUT.pix[el.dataset.a])); });
  });

    : `<div class="hist">${porDia.slice(0, 12).map(g => { g.sort((a, b) => rango[a.tipo] - rango[b.tipo]); const e = g[0];

function frontMatter(R, d) {
  if (d.tipo !== 'estado') return '';

  if (!campos.length) return '';
  return `<div style="padding:0 22px"><dl class="fm-tbl">${campos.map(([k, c]) => `<dt>${k}</dt><dd>${esc(c.valor)}</dd>`).join('')}</dl></div>`;
}

/* ============================================================
   UI: ciclo de render
   ============================================================ */
function animarEntrada(root) {
  root.classList.remove('ready');
  root.querySelectorAll('.ring .fg[data-off]').forEach(c => c.setAttribute('stroke-dashoffset', c.getAttribute('stroke-dasharray')));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.add('ready');
    root.querySelectorAll('.ring .fg[data-off]').forEach(c => c.setAttribute('stroke-dashoffset', c.dataset.off));
  }));
}
function render(opts = {}) {
  const res = consulta(S);
  document.documentElement.dataset.theme = S.tema;
  document.querySelectorAll('.views [data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === S.vista));
  renderOverview(res); renderSidebar(); renderToolbar(res);
  document.documentElement.style.setProperty('--tb-h', $('#toolbar').offsetHeight + 'px');
  const v = $('#vista');
  v.innerHTML = S.vista === 'panorama' ? renderPanorama(res) : S.vista === 'proyectos' ? renderProyectos(res) : renderMapa(res);
  if (S.vista === 'mapa') bindMapa();
  if (!opts.sinAnim) animarEntrada(v); else v.classList.add('ready');
  $('#live').textContent = `${res.lista.length} proyectos visibles`;
  if (S.abierto && opts.detalle) renderDetalle();
}

/* ============================================================
   UI: eventos
   ============================================================ */
function toggleFiltro(k, v) {
  const a = S.filtros[k]; const i = a.indexOf(v);
  if (i >= 0) a.splice(i, 1); else a.push(v);
  guardar(); render();
}
function cambiarVista(v) {
  if (!['panorama', 'proyectos', 'mapa'].includes(v)) return;
  S.vista = v; guardar();
  history.replaceState(null, '', S.abierto ? `#/${v}/${encodeURIComponent(S.abierto)}` : `#/${v}`);
  render();
}
function toggleFav(id) {
  const i = S.favoritos.indexOf(id); if (i >= 0) S.favoritos.splice(i, 1); else S.favoritos.push(id);
  guardar(); render({ sinAnim: true, detalle: true });
}
function moverEnDetalle(d) {
  const ids = consulta(S).lista.map(r => r.p.id); if (!ids.length) return;
  const i = ids.indexOf(S.abierto); abrirDetalle(ids[(i + d + ids.length) % ids.length]);
  $('#d-body').scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fav],[data-filter],[data-quick],[data-view],[data-act],[data-sort],[data-dens],[data-det],[data-blcat],[data-doc],[data-dnav],[data-open]');
  if (!t) { if ($('#sidebar').classList.contains('show') && !e.target.closest('#sidebar')) $('#sidebar').classList.remove('show'); return; }
  const d = t.dataset;
  if (d.fav !== undefined) { e.stopPropagation(); toggleFav(d.fav); return; }
  if (d.filter) { toggleFiltro(d.filter, d.v); return; }
  if (d.quick) { S.filtros.pulso = d.quick === 'todos' ? [] : [d.quick]; guardar(); render(); return; }
  if (d.view) { cambiarVista(d.view); return; }
  if (d.sort) { S.orden = d.sort; guardar(); render({ sinAnim: true }); return; }
  if (d.dens) { S.densidad = d.dens; guardar(); render(); return; }
  if (d.det) { S.detalle = d.det; guardar(); render(); return; }
  if (d.blcat) { S.blCat = S.blCat === d.blcat ? null : d.blcat; const st = $('#d-body').scrollTop; renderDetalle(); $('#d-body').scrollTop = st; return; }
  if (d.doc !== undefined) { S.docSel = +d.doc; const st = $('#d-body').scrollTop; renderDetalle(); $('#d-body').scrollTop = st; return; }
  if (d.dnav) { e.preventDefault(); const s = $('#d-' + d.dnav), b = $('#d-body'); if (s) b.scrollTo({ top: s.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - 14, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  if (d.act) {
    const st = $('#d-body') ? $('#d-body').scrollTop : 0;
    switch (d.act) {
      case 'theme': cambiarTema(); break;
      case 'clear-q': S.q = ''; $('#q').value = ''; $('#search-box').classList.remove('has-q'); render(); break;
      case 'clear-all': S.q = ''; $('#q').value = ''; $('#search-box').classList.remove('has-q'); Object.keys(S.filtros).forEach(k => S.filtros[k] = []); S.soloFav = false; guardar(); render(); break;
      case 'clear-facet': S.filtros[d.k] = []; guardar(); render(); break;
      case 'vermas': S.verMas[d.k] = true; renderSidebar(); break;
      case 'solofav': S.soloFav = !S.soloFav; guardar(); render(); break;
      case 'maptec': S.mapaTec = !S.mapaTec; guardar(); render(); break;
      case 'toggle-sidebar': $('#sidebar').classList.toggle('show'); break;
      case 'close': cerrarDetalle(); break;
      case 'prev': moverEnDetalle(-1); break;
      case 'next': moverEnDetalle(1); break;
      case 'ver-hechas': S.verHechas = !S.verHechas; renderDetalle(); $('#d-body').scrollTop = st; break;
      case 'bl-todo': S.blTodo = !S.blTodo; renderDetalle(); $('#d-body').scrollTop = st; break;
    }
    return;
  }
  if (d.open) {
    const svg = $('#mapa-svg'); if (svg && svg.dataset.justDragged) { delete svg.dataset.justDragged; return; }
    abrirDetalle(d.open, t);
  }
});
$('#scrim').addEventListener('click', cerrarDetalle);
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if (!s) return;
  S[s.dataset.sel] = s.value; guardar(); render();
});
let tq;
$('#q').addEventListener('input', e => {
  S.q = e.target.value; $('#search-box').classList.toggle('has-q', !!S.q);
  clearTimeout(tq); tq = setTimeout(() => render({ sinAnim: true }), 60);
});
function cambiarTema() {
  const html = document.documentElement; html.classList.add('theme-anim');
  S.tema = S.tema === 'dark' ? 'light' : 'dark'; html.dataset.theme = S.tema; guardar();
  setTimeout(() => html.classList.remove('theme-anim'), 380);
}
document.addEventListener('keydown', e => {
  const enCampo = e.target.matches('input, select, textarea');
  if (e.key === 'Escape') {
    if (S.abierto) { cerrarDetalle(); return; }
    if (enCampo && S.q) { S.q = ''; e.target.value = ''; $('#search-box').classList.remove('has-q'); render(); return; }
    if (enCampo) e.target.blur(); return;
  }
  if (enCampo || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 't' || e.key === 'T') { cambiarTema(); return; }
  if (S.abierto) {
    if (e.key === ']' || e.key === 'ArrowRight') { moverEnDetalle(1); return; }
    if (e.key === '[' || e.key === 'ArrowLeft') { moverEnDetalle(-1); return; }
    if (e.key === 'f' || e.key === 'F') { toggleFav(S.abierto); return; }
    if (e.key === 'Tab') {
      const f = [...$('#drawer').querySelectorAll('button, a[href], [tabindex="0"]')].filter(x => x.offsetParent);
      if (f.length && e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (f.length && !e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (['1', '2', '3'].includes(e.key)) { cambiarVista(['panorama', 'proyectos', 'mapa'][+e.key - 1]); return; }
  const items = [...document.querySelectorAll('[data-nav]')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'j' || e.key === 'ArrowDown') { if (items.length) { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); } return; }
  if (e.key === 'k' || e.key === 'ArrowUp') { if (items.length) { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.dataset.open) { e.preventDefault(); abrirDetalle(document.activeElement.dataset.open, document.activeElement); return; }
  if ((e.key === 'f' || e.key === 'F') && document.activeElement.dataset.open) toggleFav(document.activeElement.dataset.open);
});

/* Tooltip unico */
const tip = $('#tip'); let tipEl = null;
document.addEventListener('pointerover', e => {
  const el = e.target.closest('[data-tip],[data-tip-src]');
  if (!el || el === tipEl) return; tipEl = el;
  const main = el.dataset.tip || '', src = el.dataset.tipSrc || '';
  if (!main && !src) return;
  tip.innerHTML = (el.dataset.html ? main : esc(main)) + (src ? `<span class="src">${esc(src)}</span>` : '');
  tip.classList.add('on'); posTip(e);
});
document.addEventListener('pointermove', e => { if (tipEl) posTip(e); });
document.addEventListener('pointerout', e => { if (tipEl && !tipEl.contains(e.relatedTarget)) { tipEl = null; tip.classList.remove('on'); } });
function posTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

/* Arranque: ruta desde el hash (#/vista/proyecto) */
$('#stamp-fecha').textContent = 'datos al ' + fFecha(DATA.fecha_ref);
$('#perfil').textContent = DATA.perfil === 'demo' ? 'DEMO · datos sintéticos' : DATA.perfil.toUpperCase();
const [, hv, hp] = (location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || []);
if (hv && ['panorama', 'proyectos', 'mapa'].includes(hv)) S.vista = hv;
render();
if (hp && BY_ID[decodeURIComponent(hp)]) abrirDetalle(decodeURIComponent(hp));
window.addEventListener('hashchange', () => {
  const [, v, pid] = (location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || []);
  if (v && v !== S.vista) cambiarVista(v);
  if (pid && BY_ID[decodeURIComponent(pid)] && S.abierto !== decodeURIComponent(pid)) abrirDetalle(decodeURIComponent(pid));
  if (!pid && S.abierto) cerrarDetalle();
});
})();
</script>
