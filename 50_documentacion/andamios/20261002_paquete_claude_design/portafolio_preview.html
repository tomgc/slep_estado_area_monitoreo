    const catLbl = c => CAT_ITEM[c] || 'Sin categoría';
    const filtrados = p.futAb.filter(i => !S.blCat || (i.categoria || 'sin_categoria') === S.blCat).sort((a, b) => PRIO_ORD[nivelDe(a)] - PRIO_ORD[nivelDe(b)]);
    const LIM = 24, mostrar = S.blTodo ? filtrados : filtrados.slice(0, LIM);
    const grupos = {}; mostrar.forEach(i => { const c = i.categoria || 'sin_categoria'; (grupos[c] = grupos[c] || []).push(i); });
    const priorizado = tot ? Math.round(((tot - m.sin) / tot) * 100) : 0;
    const lectura = tot >= DATA.umbrales.backlog_grande ? `Reserva extensa: ${tot} elementos${m.sin / tot > .75 ? ', casi sin priorizar' : ''}.` : m.sin / Math.max(tot, 1) > .5 ? 'Reserva acotada, mayormente sin priorizar.' : 'Reserva acotada y priorizada.';
    backlog = `<div class="bl-sum"><div class="big">${tot}<small>abiertos · ${priorizado}% priorizado</small><div style="margin-top:12px">${waffle(p, 60)}</div></div>
        <div><div class="eyebrow" style="margin-bottom:8px">Por prioridad</div><div class="bars">${barras}</div></div>
        <div><div class="eyebrow" style="margin-bottom:8px">Lectura</div><p style="margin:0;font-size: var(--fs-1);color:var(--text-2)">${esc(lectura)}</p>
          <p class="muted" style="margin:8px 0 0;font-size: var(--fs-1)">Cada marca es un elemento. Relleno intenso: prioridad alta; contorno: sin prioridad documentada.</p></div></div>
      <div class="bl-cats">${catOrden.map(c => `<button class="bl-cat" data-blcat="${c}" aria-pressed="${S.blCat === c}">${esc(catLbl(c))} <b>${cats[c]}</b></button>`).join('')}</div>
      <div class="bl-grid">${Object.keys(grupos).sort((a, b) => cats[b] - cats[a]).map(c => `<div class="bl-group"><h5>${esc(catLbl(c))}</h5>${grupos[c].map(i => `<div class="bl-it ${nivelDe(i)}" data-tip="${esc(PRIO_LBL[nivelDe(i)])}${i.prioridad && i.prioridad.original ? ' (' + esc(i.prioridad.original) + ')' : ''}" data-tip-src="${esc(i.fuente.doc)} · L${i.fuente.linea}"><span class="o p-${nivelDe(i)}"></span><span>${esc(i.texto)}</span></div>`).join('')}</div>`).join('')}</div>
      ${filtrados.length > LIM ? `<button class="bl-more" data-act="bl-todo">${S.blTodo ? 'Mostrar menos' : `Mostrar los ${filtrados.length} elementos`}</button>` : ''}`;
  }

  // ROADMAP
  const roadmap = !R.hitos.length ? `<div class="d-empty">${icon('route')}Sin roadmap documentado.${p.fase ? ` La fase declarada es <b style="margin-left:4px">${esc(FASE_LBL[p.fase])}</b>.` : ''}</div>`
    : `<div class="road">${R.hitos.map((h, k) => `<div class="phase ${h.estado}${h.vencido ? ' vencido' : ''}"><span class="nd"></span>
        <span class="ph-n">Fase ${k + 1} · ${h.estado === 'hecho' ? 'completada' : h.estado === 'en_curso' ? 'en curso' : 'pendiente'}</span><h5>${esc(h.nombre)}</h5>
        <span class="when${h.vencido ? ' late' : ''}">${h.vencido ? icon('triangle-alert', 'xs') + ' objetivo vencido ' + esc(fCorta(h.objetivo)) : h.cierre ? 'cerrada ' + esc(fCorta(h.cierre)) : h.objetivo ? 'objetivo ' + esc(fFecha(h.objetivo)) : 'sin fecha'}</span>
        <ul>${h.items.map(i => `<li class="${i.estado}">${icon(i.estado === 'hecho' ? 'check' : i.estado === 'en_curso' ? 'circle-dashed' : 'circle', 'xs')}<span>${esc(i.texto)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;

  // HISTORIAL
  // Un mismo hecho suele registrarse en varios documentos (bitacora, TODO, CHANGELOG): se agrupa por fecha.
  const porDia = []; const idxDia = {};
  for (const e of R.eventos) { if (!(e.fecha in idxDia)) { idxDia[e.fecha] = porDia.length; porDia.push([]); } porDia[idxDia[e.fecha]].push(e); }
  const rango = { version: 0, registro: 1, tarea: 2 };
  const hist = !R.eventos.length ? `<div class="d-empty">${icon('history')}Sin eventos fechados en la documentación.</div>`
    : `<div class="hist">${porDia.slice(0, 12).map(g => { g.sort((a, b) => rango[a.tipo] - rango[b.tipo]); const e = g[0];
        const otros = g.slice(1).map(x => `${x.texto} (${x.doc})`).join(' · ');
        return `<div class="hist-it ${g.some(x => x.tipo === 'version') ? 'version' : e.tipo}"><span class="d">${esc(fFecha(e.fecha))}</span><span class="dot"></span><span>${esc(e.texto)}<span class="k">${e.tipo === 'version' ? 'versión' : e.tipo} · ${esc(e.doc)}</span>${g.length > 1 ? `<span class="k" data-tip="También registrado en" data-tip-src="${esc(otros)}" style="cursor:help">+${g.length - 1} fuente${g.length > 2 ? 's' : ''}</span>` : ''}</span></div>`; }).join('')}</div>`;

  // DOCUMENTOS
  const docs = R.documentos;
  const dsel = docs[S.docSel] || docs[0];
  const docHtml = !docs.length ? `<div class="d-empty">Sin documentos.</div>` : `<div class="doc-tabs" role="tablist">${docs.map((d, k) => `<button class="doc-tab" role="tab" data-doc="${k}" aria-selected="${dsel === d}">${icon('file-text', 'xs')}${esc(d.archivo)}</button>`).join('')}</div>
      <div class="doc-panel"><div class="doc-meta"><span>Rol detectado:</span>${dsel.roles.map(r => `<span class="chip">${esc(r)}</span>`).join('') || '<span class="chip">sin clasificar</span>'}<span style="margin-left:auto" class="mono">${dsel.lineas} líneas · tipo ${esc(dsel.tipo)}</span></div>
      ${frontMatter(R, dsel)}<div class="md">${dsel.html}</div></div>`;

  const ttlCrumb = `<span class="crumb">${esc(DATA.fuente.raiz)}/<b>${esc(p.id)}</b></span>`;
  $('#drawer').innerHTML = `
    <div class="d-bar">${ttlCrumb}<span class="sp"></span>
      <span class="mono muted" style="font-size: var(--fs-1)">${pos + 1} / ${ids.length}</span>
      <button class="icon-btn" data-act="prev" aria-label="Proyecto anterior" data-tip="Anterior ([)">${icon('chevron-right', 'sm')}</button>
      <button class="icon-btn" data-act="next" aria-label="Proyecto siguiente" data-tip="Siguiente (])">${icon('chevron-right', 'sm')}</button>
      ${favBtn(p).replace('class="fav', 'class="icon-btn fav').replace('opacity', '')}
      <button class="icon-btn" data-act="close" aria-label="Cerrar detalle" data-tip="Cerrar (Esc)">${icon('x', 'sm')}</button></div>
    <nav class="d-nav">${nav.map(([k, l, n]) => `<a href="#d-${k}" data-dnav="${k}" class="${k === 'resumen' ? 'on' : ''}">${l}${n !== '' ? ` <span class="n">${n}</span>` : ''}</a>`).join('')}</nav>
    <div class="d-body" id="d-body">
      <section id="d-resumen" class="in">
        <div class="d-head"><div>
          <div class="eyebrow">${p.categoria ? esc(p.categoria) : 'Sin categoría'}${p.prioridad ? ` · prioridad ${esc(p.prioridad)}` : ''}</div>
          <h2 id="d-title">${esc(p.nombre)}</h2>
          <p class="desc ${p.desc ? '' : 'src-ausente'}" ${srcAttr(R.descripcion)}>${p.desc ? esc(p.desc) : 'Sin descripción documentada.'}</p>
          <div class="chips">${pulsePill(p)}<span class="pill" ${srcAttr(R.fase)}>${icon('milestone', 'xs')}${p.fase ? esc(FASE_LBL[p.fase]) : 'Fase no documentada'}</span>${chipsTec}${chipsTag}</div>
          <div class="upd">${icon('clock', 'sm')}${p.ult ? `Actualizado ${relativo(p.dias)} · ${esc(fFecha(p.ult))}` : 'Sin fecha de actualización documentada'}<span class="muted mono" style="font-size: var(--fs-1)">${esc(fuenteTxt(R.ultima_actividad))}</span></div>
        </div><div class="ring-big">${ring(p, 112)}<div class="how">${p.avance.tipo === 'declarado' ? esc(p.avance.fuente.doc) : p.avance.tipo === 'hitos' ? 'desde roadmap' : 'avance'}</div></div></div>
        ${journey}
      </section>
      <section>${hero}</section>
      <section><div class="sec-h"><h3>Estado</h3><span class="rule"></span></div><div class="tiles">${situ}${act}${bloq}${sig}</div></section>
      <section id="d-ahora"><div class="sec-h"><h3>Ahora</h3><span class="n">${p.inmAb.length} abiertas · ${hechas.length} hechas</span><span class="rule"></span><span class="src">trabajo inmediato · TODO</span></div>${ahora}</section>
      <section id="d-backlog"><div class="sec-h"><h3>Backlog</h3><span class="n">${p.futAb.length}</span><span class="rule"></span><span class="src">reserva de trabajo futuro</span></div>${backlog}</section>
      <section id="d-roadmap"><div class="sec-h"><h3>Roadmap</h3><span class="n">${R.metricas.fases_hechas}/${R.hitos.length} fases</span><span class="rule"></span><span class="src">plan por fases</span></div>${roadmap}</section>
      <section id="d-historial"><div class="sec-h"><h3>Historial</h3><span class="n">${R.eventos.length}</span><span class="rule"></span><span class="src">eventos fechados</span></div>${hist}</section>
      <section id="d-docs"><div class="sec-h"><h3>Documentos</h3><span class="n">${docs.length}</span><span class="rule"></span></div>${docHtml}</section>
    </div>`;
  // prev con flecha invertida
  const prevIco = $('#drawer [data-act="prev"] svg'); if (prevIco) prevIco.style.transform = 'rotate(180deg)';
  animarEntrada($('#drawer'));
  requestAnimationFrame(() => { const j = $('#drawer .journey .bar'); if (j) j.style.width = j.style.getPropertyValue('--w'); });
  const body = $('#d-body');
  body.addEventListener('scroll', () => {
    let cur = 'resumen';
    const top = body.getBoundingClientRect().top;
    for (const s of body.querySelectorAll('section[id]')) if (s.getBoundingClientRect().top - top < 60) cur = s.id.slice(2);
    if (body.scrollTop + body.clientHeight >= body.scrollHeight - 4) cur = 'docs';
    $('#drawer').querySelectorAll('[data-dnav]').forEach(a => a.classList.toggle('on', a.dataset.dnav === cur));
  }, { passive: true });
}
function frontMatter(R, d) {
  if (d.tipo !== 'estado') return '';
  const campos = [['Estado', R.pulso], ['Fase', R.fase], ['Última actividad', R.ultima_actividad], ['Prioridad', R.prioridad], ['Categoría', R.categoria]]
    .filter(([, c]) => c && c.fuente && c.fuente.doc === d.archivo && c.fuente.seccion !== 'título');
  if (!campos.length) return '';
  return `<div style="padding:0 22px"><dl class="fm-tbl">${campos.map(([k, c]) => `<dt>${k}</dt><dd>${esc(c.valor)}</dd>`).join('')}</dl></div>`;
}

/* ============================================================
   UI: ciclo de render
   ============================================================ */
function animarEntrada(root) {
  root.classList.remove('ready');
  root.querySelectorAll('.ring .fg[data-off]').forEach(c => c.setAttribute('stroke-dashoffset', c.getAttribute('stroke-dasharray')));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.add('ready');
    root.querySelectorAll('.ring .fg[data-off]').forEach(c => c.setAttribute('stroke-dashoffset', c.dataset.off));
  }));
}
function render(opts = {}) {
  const res = consulta(S);
  document.documentElement.dataset.theme = S.tema;
  document.querySelectorAll('.views [data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === S.vista));
  renderOverview(res); renderSidebar(); renderToolbar(res);
  document.documentElement.style.setProperty('--tb-h', $('#toolbar').offsetHeight + 'px');
  const v = $('#vista');
  v.innerHTML = S.vista === 'panorama' ? renderPanorama(res) : S.vista === 'proyectos' ? renderProyectos(res) : renderMapa(res);
  if (S.vista === 'mapa') bindMapa();
  if (!opts.sinAnim) animarEntrada(v); else v.classList.add('ready');
  $('#live').textContent = `${res.lista.length} proyectos visibles`;
  if (S.abierto && opts.detalle) renderDetalle();
}

/* ============================================================
   UI: eventos
   ============================================================ */
function toggleFiltro(k, v) {
  const a = S.filtros[k]; const i = a.indexOf(v);
  if (i >= 0) a.splice(i, 1); else a.push(v);
  guardar(); render();
}
function cambiarVista(v) {
  if (!['panorama', 'proyectos', 'mapa'].includes(v)) return;
  S.vista = v; guardar();
  history.replaceState(null, '', S.abierto ? `#/${v}/${encodeURIComponent(S.abierto)}` : `#/${v}`);
  render();
}
function toggleFav(id) {
  const i = S.favoritos.indexOf(id); if (i >= 0) S.favoritos.splice(i, 1); else S.favoritos.push(id);
  guardar(); render({ sinAnim: true, detalle: true });
}
function moverEnDetalle(d) {
  const ids = consulta(S).lista.map(r => r.p.id); if (!ids.length) return;
  const i = ids.indexOf(S.abierto); abrirDetalle(ids[(i + d + ids.length) % ids.length]);
  $('#d-body').scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fav],[data-filter],[data-quick],[data-view],[data-act],[data-sort],[data-dens],[data-det],[data-blcat],[data-doc],[data-dnav],[data-open]');
  if (!t) { if ($('#sidebar').classList.contains('show') && !e.target.closest('#sidebar')) $('#sidebar').classList.remove('show'); return; }
  const d = t.dataset;
  if (d.fav !== undefined) { e.stopPropagation(); toggleFav(d.fav); return; }
  if (d.filter) { toggleFiltro(d.filter, d.v); return; }
  if (d.quick) { S.filtros.pulso = d.quick === 'todos' ? [] : [d.quick]; guardar(); render(); return; }
  if (d.view) { cambiarVista(d.view); return; }
  if (d.sort) { S.orden = d.sort; guardar(); render({ sinAnim: true }); return; }
  if (d.dens) { S.densidad = d.dens; guardar(); render(); return; }
  if (d.det) { S.detalle = d.det; guardar(); render(); return; }
  if (d.blcat) { S.blCat = S.blCat === d.blcat ? null : d.blcat; const st = $('#d-body').scrollTop; renderDetalle(); $('#d-body').scrollTop = st; return; }
  if (d.doc !== undefined) { S.docSel = +d.doc; const st = $('#d-body').scrollTop; renderDetalle(); $('#d-body').scrollTop = st; return; }
  if (d.dnav) { e.preventDefault(); const s = $('#d-' + d.dnav), b = $('#d-body'); if (s) b.scrollTo({ top: s.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - 14, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  if (d.act) {
    const st = $('#d-body') ? $('#d-body').scrollTop : 0;
    switch (d.act) {
      case 'theme': cambiarTema(); break;
      case 'clear-q': S.q = ''; $('#q').value = ''; $('#search-box').classList.remove('has-q'); render(); break;
      case 'clear-all': S.q = ''; $('#q').value = ''; $('#search-box').classList.remove('has-q'); Object.keys(S.filtros).forEach(k => S.filtros[k] = []); S.soloFav = false; guardar(); render(); break;
      case 'clear-facet': S.filtros[d.k] = []; guardar(); render(); break;
      case 'vermas': S.verMas[d.k] = true; renderSidebar(); break;
      case 'solofav': S.soloFav = !S.soloFav; guardar(); render(); break;
      case 'maptec': S.mapaTec = !S.mapaTec; guardar(); render(); break;
      case 'toggle-sidebar': $('#sidebar').classList.toggle('show'); break;
      case 'close': cerrarDetalle(); break;
      case 'prev': moverEnDetalle(-1); break;
      case 'next': moverEnDetalle(1); break;
      case 'ver-hechas': S.verHechas = !S.verHechas; renderDetalle(); $('#d-body').scrollTop = st; break;
      case 'bl-todo': S.blTodo = !S.blTodo; renderDetalle(); $('#d-body').scrollTop = st; break;
    }
    return;
  }
  if (d.open) {
    const svg = $('#mapa-svg'); if (svg && svg.dataset.justDragged) { delete svg.dataset.justDragged; return; }
    abrirDetalle(d.open, t);
  }
});
$('#scrim').addEventListener('click', cerrarDetalle);
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if (!s) return;
  S[s.dataset.sel] = s.value; guardar(); render();
});
let tq;
$('#q').addEventListener('input', e => {
  S.q = e.target.value; $('#search-box').classList.toggle('has-q', !!S.q);
  clearTimeout(tq); tq = setTimeout(() => render({ sinAnim: true }), 60);
});
function cambiarTema() {
  const html = document.documentElement; html.classList.add('theme-anim');
  S.tema = S.tema === 'dark' ? 'light' : 'dark'; html.dataset.theme = S.tema; guardar();
  setTimeout(() => html.classList.remove('theme-anim'), 380);
}
document.addEventListener('keydown', e => {
  const enCampo = e.target.matches('input, select, textarea');
  if (e.key === 'Escape') {
    if (S.abierto) { cerrarDetalle(); return; }
    if (enCampo && S.q) { S.q = ''; e.target.value = ''; $('#search-box').classList.remove('has-q'); render(); return; }
    if (enCampo) e.target.blur(); return;
  }
  if (enCampo || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 't' || e.key === 'T') { cambiarTema(); return; }
  if (S.abierto) {
    if (e.key === ']' || e.key === 'ArrowRight') { moverEnDetalle(1); return; }
    if (e.key === '[' || e.key === 'ArrowLeft') { moverEnDetalle(-1); return; }
    if (e.key === 'f' || e.key === 'F') { toggleFav(S.abierto); return; }
    if (e.key === 'Tab') {
      const f = [...$('#drawer').querySelectorAll('button, a[href], [tabindex="0"]')].filter(x => x.offsetParent);
      if (f.length && e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (f.length && !e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (['1', '2', '3'].includes(e.key)) { cambiarVista(['panorama', 'proyectos', 'mapa'][+e.key - 1]); return; }
  const items = [...document.querySelectorAll('[data-nav]')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'j' || e.key === 'ArrowDown') { if (items.length) { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); } return; }
  if (e.key === 'k' || e.key === 'ArrowUp') { if (items.length) { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.dataset.open) { e.preventDefault(); abrirDetalle(document.activeElement.dataset.open, document.activeElement); return; }
  if ((e.key === 'f' || e.key === 'F') && document.activeElement.dataset.open) toggleFav(document.activeElement.dataset.open);
});

/* Tooltip unico */
const tip = $('#tip'); let tipEl = null;
document.addEventListener('pointerover', e => {
  const el = e.target.closest('[data-tip],[data-tip-src]');
  if (!el || el === tipEl) return; tipEl = el;
  const main = el.dataset.tip || '', src = el.dataset.tipSrc || '';
  if (!main && !src) return;
  tip.innerHTML = (el.dataset.html ? main : esc(main)) + (src ? `<span class="src">${esc(src)}</span>` : '');
  tip.classList.add('on'); posTip(e);
});
document.addEventListener('pointermove', e => { if (tipEl) posTip(e); });
document.addEventListener('pointerout', e => { if (tipEl && !tipEl.contains(e.relatedTarget)) { tipEl = null; tip.classList.remove('on'); } });
function posTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

/* Arranque: ruta desde el hash (#/vista/proyecto) */
$('#stamp-fecha').textContent = 'datos al ' + fFecha(DATA.fecha_ref);
$('#perfil').textContent = DATA.perfil === 'demo' ? 'Demo · datos sintéticos' : DATA.perfil.charAt(0).toUpperCase() + DATA.perfil.slice(1);
const [, hv, hp] = (location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || []);
if (hv && ['panorama', 'proyectos', 'mapa'].includes(hv)) S.vista = hv;
render();
if (hp && BY_ID[decodeURIComponent(hp)]) abrirDetalle(decodeURIComponent(hp));
window.addEventListener('hashchange', () => {
  const [, v, pid] = (location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/) || []);
  if (v && v !== S.vista) cambiarVista(v);
  if (pid && BY_ID[decodeURIComponent(pid)] && S.abierto !== decodeURIComponent(pid)) abrirDetalle(decodeURIComponent(pid));
  if (!pid && S.abierto) cerrarDetalle();
});
})();
</script>
</body>
</html>
