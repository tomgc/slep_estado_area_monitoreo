/* ============================================================
   TOKENS
   ============================================================ */
/* Paleta: SLEP Costa Central, colors_and_type.css ("Paleta de colores 1" + colores del logo).
   Tipografia: solo gobCL (Light 300, Regular 400, Bold 700, Heavy 900), tambien para cifras
   (sus digitos son de ancho fijo). Cinco tamaños de letra, minimo 14 px. */
:root {
  --font: 'gobCL', sans-serif;
  --mono: 'gobCL', sans-serif;
  /* gobCL tiene altura de x baja (0,49 em): 14 px es el minimo legible (x ~ 7 px). */
  --fs-1: 14px;   /* minimo: metadatos, rotulos, cifras secundarias */
  --fs-2: 15px;   /* texto de interfaz y cuerpo */
  --fs-3: 17px;   /* nombres de proyecto, enfasis, proximo paso */
  --fs-4: 24px;   /* titulos de vista y de detalle */
  --fs-5: 44px;   /* cifras protagonistas */
  --r-sm: 2px; --r: 4px; --r-lg: 8px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 120ms; --t: 200ms; --t-slow: 320ms;
  --sidebar: 268px; --top-h: 68px;
  /* Color principal: azul institucional (ocean). */
  --brand: #0062A0; --brand-80: #00558A; --on-brand: #FFF6E0;
}
/* Claro: canvas crema institucional (por defecto). */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #FFF6E0;
  --surface: #FFFFFF; --surface-2: #FFFBEF; --surface-3: #F4E9CC; --surface-hover: #FFFBEF;
  --line: #E7DFC9; --line-2: #C8BDA0; --line-3: #BCA493;
  --text: #1C1212; --text-2: #2E2230; --text-3: #747474; --text-4: #8E857B;
  --accent: #0062A0; --accent-ink: #FFF6E0; --accent-soft: #D4E4F1; --accent-line: rgba(0, 98, 160, .45);
  --ok: #75924E; --danger: #EE2D49; --pause: #4A2746; --closed: #747474; --warn: #FFC92E; --warn-ink: #7A5A00;
  --ok-soft: rgba(117, 146, 78, .14); --danger-soft: rgba(238, 45, 73, .10); --pause-soft: #EEDCE5;
  /* Naranja (coral oscurecido para contraste): bloqueos y atencion. El rojo queda reservado a lo grave. */
  --block: #D2693A; --block-ink: #9A4A22; --block-soft: rgba(232, 134, 99, .18);
  --closed-soft: rgba(116, 116, 116, .12); --warn-soft: rgba(255, 201, 46, .28);
  --shadow: 0 2px 8px rgba(74, 39, 70, .08);
  --shadow-drawer: 0 8px 24px rgba(74, 39, 70, .12);
  --scrim: rgba(28, 18, 18, .28);
  --heat-0: #F4E9CC; --heat-1: rgba(0, 98, 160, .30); --heat-2: rgba(0, 98, 160, .62); --heat-3: #0062A0;
}
/* Oscuro: derivado de ink y plum de la misma paleta. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1A1218;
  --surface: #241A22; --surface-2: #2E2230; --surface-3: #3A2C3A; --surface-hover: #2A1F28;
  --line: #3A2D38; --line-2: #4E3E4B; --line-3: #6A5866;
  --text: #FFF6E0; --text-2: #E7DFC9; --text-3: #BCA493; --text-4: #9A8B80;
  --accent: #5AA9E0; --accent-ink: #1C1212; --accent-soft: rgba(42, 143, 217, .20); --accent-line: rgba(90, 169, 224, .5);
  --ok: #9BC93E; --danger: #F2546B; --pause: #C99BB8; --closed: #A8A8A8; --warn: #FFC92E; --warn-ink: #FFC92E;
  --ok-soft: rgba(155, 201, 62, .14); --danger-soft: rgba(242, 84, 107, .14); --pause-soft: rgba(201, 155, 184, .16);
  --block: #E88663; --block-ink: #F0A383; --block-soft: rgba(232, 134, 99, .18);
  --closed-soft: rgba(168, 168, 168, .14); --warn-soft: rgba(255, 201, 46, .16);
  --shadow: 0 2px 8px rgba(0, 0, 0, .35);
  --shadow-drawer: 0 8px 24px rgba(0, 0, 0, .5);
  --scrim: rgba(10, 6, 9, .55);
  --heat-0: #3A2C3A; --heat-1: rgba(90, 169, 224, .35); --heat-2: rgba(90, 169, 224, .65); --heat-3: #5AA9E0;
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: var(--fs-1); line-height: 1.5;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-weight: 400;
}
html.theme-anim, html.theme-anim * { transition: background-color var(--t-slow) var(--ease), border-color var(--t-slow) var(--ease), color var(--t-slow) var(--ease), fill var(--t-slow) var(--ease) !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ico.sm { width: 13px; height: 13px; } .ico.xs { width: 11px; height: 11px; stroke-width: 2.2; } .ico.lg { width: 20px; height: 20px; }
.mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--accent-line); padding: 0 1px; }
.eyebrow { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.kbd { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 2px; padding: 0 6px; line-height: 18px; }

/* Procedencia del dato */
.src-inferido { text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }
.src-ausente { color: var(--text-3); font-style: italic; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 24px;
  height: var(--top-h); padding: 0 28px; background: var(--brand); color: var(--on-brand);
}
.brand { display: flex; flex-direction: column; justify-content: center; min-width: calc(var(--sidebar) - 28px); line-height: 1.25; }
.brand-name { font-weight: 900; font-size: var(--fs-3); }
.brand-sub { font-size: var(--fs-1); font-weight: 300; opacity: .85; }
.views { display: flex; gap: 4px; }
.views button { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--r); color: color-mix(in srgb, var(--on-brand) 78%, transparent); font-size: var(--fs-2); transition: color var(--t-fast), background var(--t-fast); }
.views button:hover { color: var(--on-brand); background: var(--brand-80); }
.views button[aria-selected="true"] { color: var(--brand); background: var(--on-brand); font-weight: 700; }
.views button[aria-selected="true"] .ico { color: var(--brand); }
.views .k { font-size: var(--fs-1); opacity: .6; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input {
  width: 100%; height: 40px; padding: 0 70px 0 40px; border-radius: var(--r); border: 1px solid transparent;
  background: #FFFFFF; color: #1C1212; outline: none; font-size: var(--fs-2); transition: box-shadow var(--t);
}
.search input::placeholder { color: #747474; }
.search input:focus { box-shadow: 0 0 0 3px var(--warn); }
.search > .ico { position: absolute; left: 13px; top: 12px; color: #747474; }
.search .kbd { position: absolute; right: 12px; top: 10px; color: #747474; border-color: #C8BDA0; }
.search .clear { position: absolute; right: 10px; top: 10px; display: none; color: #747474; padding: 2px; border-radius: var(--r-sm); }
.search.has-q .clear { display: block; } .search.has-q .kbd { display: none; }
.top-actions { display: flex; align-items: center; gap: 14px; }
.stamp { display: flex; align-items: center; gap: 10px; font-size: var(--fs-1); white-space: nowrap; color: color-mix(in srgb, var(--on-brand) 80%, transparent); }
.stamp .tag-demo { color: #1C1212; background: var(--warn); border-radius: var(--r-sm); padding: 2px 8px; font-weight: 700; }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); transition: color var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
.icon-btn:hover { color: var(--text); border-color: var(--line-3); }
.icon-btn:active { transform: scale(.94); }
.topbar .icon-btn { background: transparent; border-color: color-mix(in srgb, var(--on-brand) 35%, transparent); color: var(--on-brand); }
.topbar .icon-btn:hover { background: var(--brand-80); }
.icon-btn .i-sun { display: none; } :root[data-theme="dark"] .icon-btn .i-sun { display: block; } :root[data-theme="dark"] .icon-btn .i-moon { display: none; }

.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); align-items: start; }
.main { min-width: 0; padding: 0 28px 72px 28px; }

/* ============================================================
   OVERVIEW (cabecera editorial)
   ============================================================ */
.overview { display: grid; grid-template-columns: minmax(300px, 1.1fr) minmax(360px, 1.6fr) minmax(280px, 1fr); gap: 0; margin: 24px 28px 8px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.ov-block { padding: 24px 28px 22px; min-width: 0; }
.ov-block + .ov-block { border-left: 1px solid var(--line); }
.ov-total { display: flex; align-items: baseline; gap: 12px; margin: 10px 0 16px; }
.ov-total b { font-weight: 900; font-size: var(--fs-5); line-height: 1; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ov-total span { font-size: var(--fs-3); color: var(--text-2); }
.pulse-legend { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.pl-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border-radius: 4px; border: 1px solid transparent; color: var(--text-2); transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast); }
.pl-chip:hover { background: var(--surface-2); color: var(--text); }
.pl-chip[aria-pressed="true"] { background: var(--surface-3); border-color: var(--line-2); color: var(--text); }
.pl-chip b { font-family: var(--mono); font-weight: 700; color: var(--text); }
.pl-chip.zero { opacity: .45; }
.fase-dist { margin-top: 20px; }
.fase-dist .bar { display: flex; gap: 2px; height: 14px; margin: 8px 0 8px; }
.fase-dist .seg { border-radius: 2px; background: var(--accent); opacity: .25; transition: opacity var(--t); min-width: 3px; }
.fase-dist .seg:hover { opacity: 1; }
.fase-dist .seg.f-unknown { background: transparent; box-shadow: inset 0 0 0 1px var(--line-3); opacity: 1; }
.fase-dist .lbls { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-1); color: var(--text-3); }
.fase-dist .lbls b { color: var(--text-2); font-family: var(--mono); font-weight: 400; }

.skyline-wrap { position: relative; height: 196px; margin-top: 12px; }
.skyline { display: flex; align-items: flex-end; gap: 8px; height: 168px; padding: 0 2px; border-bottom: 1px solid var(--line-2); }
.sky-bar { position: relative; flex: 1; min-width: 10px; max-width: 40px; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
.sky-bar .fill { animation: grow 700ms var(--ease) both; animation-delay: calc(var(--k, 0) * 30ms); width: 100%; border-radius: 2px 4px 1px 1px; background: var(--c); opacity: .78; transform-origin: bottom; transition: opacity var(--t-fast), transform var(--t-slow) var(--ease); }
.sky-bar.none .fill { background: repeating-linear-gradient(135deg, var(--line-3) 0 2px, transparent 2px 5px); opacity: .9; }
.sky-bar:hover .fill, .sky-bar:focus-visible .fill { opacity: 1; }
.sky-bar.dim .fill { opacity: .14; }
.sky-bar .cap { position: absolute; left: 50%; bottom: calc(var(--h) + 4px); transform: translateX(-50%); }
.sky-axis { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: var(--fs-1); color: var(--text-4); }
.attn-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.attn-item { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: left; padding: 8px 10px; margin: 0 -10px; border-radius: 4px; transition: background var(--t-fast); }
.attn-item:hover { background: var(--surface-2); }
.attn-item .t { font-weight: 700; font-size: var(--fs-1); }
.attn-item .s { font-size: var(--fs-1); color: var(--text-3); }
.attn-empty { color: var(--text-3); font-size: var(--fs-1); margin-top: 10px; }

/* ============================================================
   SIDEBAR (filtros)
   ============================================================ */
.sidebar { position: sticky; top: var(--top-h); max-height: calc(100vh - var(--top-h)); overflow: auto; padding: 24px 18px 48px 28px; scrollbar-width: thin; }
.facet { margin-bottom: 28px; }
.facet h3 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font-family: var(--mono); font-size: var(--fs-1); font-weight: 400; color: var(--text-3); }
.facet-opt { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px 0 8px; border-radius: 4px; color: var(--text-2); text-align: left; transition: background var(--t-fast), color var(--t-fast); }
.facet-opt:hover { background: var(--surface-2); color: var(--text); }
.facet-opt[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.facet-opt .n { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.facet-opt.zero { opacity: .4; }
.facet-opt .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet .more { font-size: var(--fs-1); color: var(--text-3); padding: 4px 6px; }
.facet .more:hover { color: var(--accent); }
.box { width: 14px; height: 14px; border-radius: 2px; border: 1.5px solid var(--line-3); display: inline-grid; place-items: center; transition: background var(--t-fast), border-color var(--t-fast); }
.facet-opt[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.facet-opt[aria-pressed="true"] .box::after { content: ''; width: 5px; height: 3px; border: 1.6px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.side-foot { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); font-size: var(--fs-1); color: var(--text-3); line-height: 2; }
.side-foot .kbd { margin-right: 4px; }

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar { position: sticky; top: var(--top-h); z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 24px 0 18px; background: linear-gradient(var(--bg) 78%, transparent); }
.toolbar h1 { margin: 0; font-size: var(--fs-3); font-weight: 700; letter-spacing: -.02em; }
.toolbar .count { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.seg-ctl { display: inline-flex; padding: 2px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); }
.seg-ctl button { height: 32px; padding: 0 14px; border-radius: 4px; font-size: var(--fs-1); color: var(--text-2); transition: background var(--t-fast), color var(--t-fast); }
.seg-ctl button:hover { color: var(--text); }
.seg-ctl button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.tb-spacer { flex: 1; }
.select { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--text-3); font-size: var(--fs-1); }
.select select { border: 0; background: transparent; color: var(--text); height: 34px; font-size: var(--fs-2); padding-right: 4px; outline: none; cursor: pointer; }
.select select option { background: var(--surface); color: var(--text); }
.link-btn { font-size: var(--fs-1); color: var(--text-3); display: inline-flex; gap: 5px; align-items: center; }
.link-btn:hover { color: var(--accent); }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.af { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 12px; border-radius: 4px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: var(--fs-1); }
.af:hover { filter: brightness(1.1); }

/* ============================================================
   GLIFOS COMPARTIDOS
   ============================================================ */
/* Pulso: color + forma (redundancia para daltonismo) */
.pulse { --c: var(--text-3); position: relative; display: inline-grid; place-items: center; width: 12px; height: 12px; flex: none; }
.pulse::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pulse.p-activo { --c: var(--ok); }
.pulse.p-activo::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--c); opacity: .5; animation: ping 2.4s var(--ease) infinite; }
.pulse.p-bloqueado { --c: var(--block); } .pulse.p-bloqueado::before { border-radius: 2px; width: 8px; height: 8px; transform: rotate(45deg); }
.pulse.p-pausa { --c: var(--pause); } .pulse.p-pausa::before { width: 8px; height: 9px; border-radius: 2px; background: linear-gradient(90deg, var(--c) 0 35%, transparent 35% 65%, var(--c) 65%); }
.pulse.p-cerrado { --c: var(--closed); } .pulse.p-cerrado::before { width: 9px; height: 9px; background: none; border: 2px solid var(--c); }
.pulse.p-desconocido::before { width: 9px; height: 9px; background: none; border: 1.5px dashed var(--text-3); }
.pulse.stale::after { display: none; }
@keyframes ping { 0% { transform: scale(.7); opacity: .6; } 70%, 100% { transform: scale(1.7); opacity: 0; } }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px 0 8px; border-radius: 4px; font-size: var(--fs-1); font-weight: 400; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.p-activo { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.p-bloqueado { background: var(--block-soft); color: var(--block-ink); border-color: transparent; }
.pill.p-pausa { background: var(--pause-soft); color: var(--pause); border-color: transparent; }
.pill.p-cerrado { background: var(--closed-soft); color: var(--closed); border-color: transparent; }
.pill.p-desconocido { background: transparent; color: var(--text-3); border-style: dashed; border-color: var(--line-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 4px; font-size: var(--fs-1); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.tech { font-family: var(--mono); font-size: var(--fs-1); }
.chip.tag { background: transparent; color: var(--text-3); }
.chip.tag::before { content: '#'; color: var(--text-4); }

/* Escalera de fase */
.steps { display: flex; gap: 2px; align-items: center; }
.steps i { width: 13px; height: 6px; border-radius: 2px; background: var(--surface-3); transition: background var(--t); }
.steps i.on { background: color-mix(in srgb, var(--accent) 45%, var(--surface-3)); }
.steps i.cur { background: var(--accent); box-shadow: 0 0 8px -1px var(--accent); }
.steps.closed i.on, .steps.closed i.cur { background: var(--closed); box-shadow: none; }
.steps.unknown i { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.fase-cell .lbl { display: block; margin-top: 5px; font-size: var(--fs-1); color: var(--text-2); }
.fase-cell .lbl.none { color: var(--text-3); font-style: italic; }

/* Progreso */
.prog { display: grid; gap: 5px; }
.prog .track { position: relative; height: 10px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.prog .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 60%, transparent), var(--accent)); transition: width 900ms var(--ease); }
.ready .prog .fill { width: calc(var(--p) * 100%); }
.prog.closed .fill { background: var(--closed); }
.prog .segs { display: flex; gap: 3px; height: 10px; }
.prog .segs i { flex: 1; border-radius: 2px; background: var(--surface-3); transition: background 500ms var(--ease) calc(var(--k) * 90ms); }
.ready .prog .segs i.on { background: var(--accent); }
.prog .segs i.half { background: linear-gradient(90deg, var(--accent) 50%, var(--surface-3) 50%); }
.prog .dash { height: 10px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--line-2) 0 4px, transparent 4px 7px); }
.prog .meta { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-1); color: var(--text-3); }
.prog .meta b { font-family: var(--mono); font-weight: 700; font-size: var(--fs-1); color: var(--text); font-variant-numeric: tabular-nums; }
.prog .meta .how { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-4); }

/* Actividad (26 semanas) */
.heat { display: flex; gap: 1.5px; align-items: flex-end; height: 26px; }
.heat i { width: 3.5px; height: 26px; border-radius: 2px; background: var(--heat-0); }
.heat i.l1 { background: var(--heat-1); } .heat i.l2 { background: var(--heat-2); } .heat i.l3 { background: var(--heat-3); }
.heat.none { width: 88px; height: 26px; border-radius: 2px; background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 5px); }
.act-cell .lbl { display: block; margin-top: 4px; font-size: var(--fs-1); color: var(--text-3); }

/* Backlog: una marca por elemento, la intensidad es la prioridad */
.strip { display: flex; gap: 1.5px; align-items: center; height: 24px; overflow: hidden; }
.strip i { width: 3px; height: 22px; border-radius: 2px; flex: none; }
.p-alta { background: var(--accent); } .p-media { background: color-mix(in srgb, var(--accent) 55%, var(--surface-3)); }
.p-baja { background: color-mix(in srgb, var(--accent) 25%, var(--surface-3)); }
.p-sin { background: transparent; box-shadow: inset 0 0 0 1px var(--text-4); }
.strip .more { margin-left: 4px; font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.bl-cell .lbl { display: flex; gap: 6px; margin-top: 4px; font-size: var(--fs-1); color: var(--text-3); }
.bl-cell .lbl b { font-family: var(--mono); color: var(--text); font-weight: 700; }
.waffle { display: grid; grid-template-columns: repeat(12, 8px); gap: 3px; }
.waffle i { width: 8px; height: 8px; border-radius: 2px; }

/* Prioridad: tres barras ascendentes */
.prio { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; vertical-align: middle; }
.prio i { width: 3px; border-radius: 2px; background: var(--line-2); }
.prio i:nth-child(1) { height: 5px; } .prio i:nth-child(2) { height: 8px; } .prio i:nth-child(3) { height: 11px; }
.prio.lv1 i:nth-child(-n+1), .prio.lv2 i:nth-child(-n+2), .prio.lv3 i { background: var(--accent); }

/* Senales */
.sigs { display: inline-flex; gap: 5px; align-items: center; }
.sig { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; color: var(--text-3); }
.sig.atencion { color: var(--block-ink); background: var(--block-soft); }
.sig.aviso { color: var(--warn-ink); background: var(--warn-soft); }
.sig.info { color: var(--text-3); background: var(--surface-2); }

/* Favorito */
.fav { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; color: var(--text-4); opacity: 0; transition: opacity var(--t-fast), color var(--t-fast), transform var(--t-fast); }
.fav.on { opacity: 1; color: var(--warn-ink); }
.fav.on .ico { fill: currentColor; }
.fav:hover { color: var(--warn-ink); transform: scale(1.1); }

/* ============================================================
   VISTA PANORAMA
   ============================================================ */
.pano { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); overflow: clip; }
.pano-row { display: grid; grid-template-columns: 44px minmax(220px, 1.4fr) 112px 120px 108px minmax(200px, 1.5fr) 64px 128px 84px 84px; align-items: center; column-gap: 18px; padding: 0 20px 0 10px; }
.pano-head { position: sticky; top: calc(var(--top-h) + var(--tb-h, 74px)); z-index: 5; height: 44px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.pano-head button { display: inline-flex; align-items: center; gap: 4px; color: inherit; }
.pano-head button:hover, .pano-head button.on { color: var(--text); }
.pano-head .r { justify-self: end; }
.group-h { display: flex; align-items: center; gap: 10px; padding: 22px 20px 12px 22px; font-size: var(--fs-1); font-weight: 700; color: var(--text); border-top: 1px solid var(--line); }
.group-h:first-of-type { border-top: 0; }
.group-h .n { font-family: var(--mono); font-weight: 400; color: var(--text-3); }
.group-h .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.p-row { position: relative; min-height: 84px; padding-top: 16px; padding-bottom: 16px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); cursor: pointer; outline: none; transition: background var(--t-fast); animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(min(var(--i), 18) * 16ms); }
.p-row::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); transform: scaleY(0); transition: transform var(--t) var(--ease); }
.p-row:hover, .p-row:focus-visible, .p-row.sel { background: var(--surface-hover); }
.p-row:hover::before, .p-row:focus-visible::before, .p-row.sel::before { transform: scaleY(1); }
.p-row:hover .fav, .p-row:focus-visible .fav { opacity: 1; }
.p-row .lead { display: flex; align-items: center; gap: 4px; }
.p-row .name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.p-row .name b { font-size: var(--fs-2); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row .name .id { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-4); white-space: nowrap; }
.p-row .desc { margin-top: 4px; font-size: var(--fs-1); color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.p-row .hits { margin-top: 4px; font-size: var(--fs-1); color: var(--accent); font-family: var(--mono); }
.next { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: start; font-size: var(--fs-1); color: var(--text); }
.next .ico { color: var(--accent); margin-top: 2px; }
.next span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.next.none .ico { color: var(--text-4); }

/* Anillo de progreso */

.map-legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: var(--fs-1); color: var(--text-2); }

.tiles { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }

.bl-it { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 5px 0; font-size: var(--fs-1); color: var(--text-2); }
.bl-it .o { width: 9px; height: 9px; margin-top: 4.5px; border-radius: 50%; border: 1.5px solid var(--text-4); }

/* ROADMAP */
.road { display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }

.phase .nd { position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-3); background: var(--bg); }
.phase.hecho .nd { border-color: var(--accent); background: var(--accent); }

.phase.en_curso .nd::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); animation: breathe 2s var(--ease) infinite; }

@keyframes breathe { 50% { opacity: .35; } }
.phase .ph-n { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-4); }
.phase h5 { margin: 2px 0 2px; font-size: var(--fs-1); font-weight: 700; }
.phase .when { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.phase .when.late { color: var(--warn-ink); }
.phase ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: var(--fs-1); color: var(--text-2); }
.phase li { display: grid; grid-template-columns: 12px 1fr; gap: 5px; }
.phase li .ico { margin-top: 2px; }
.phase li.hecho { color: var(--text-3); }
.phase li.hecho .ico { color: var(--accent); }
.phase.pendiente h5 { color: var(--text-2); }

/* HISTORIAL */
.hist { position: relative; display: grid; gap: 2px; }
.hist::before { content: ''; position: absolute; left: 121px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.hist-it { display: grid; grid-template-columns: 110px 22px 1fr; align-items: start; gap: 0; padding: 7px 0; font-size: var(--fs-1); }
.hist-it .d { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); padding-top: 1px; }
.hist-it .dot { width: 9px; height: 9px; margin: 5px 0 0 7px; border-radius: 50%; background: var(--bg); border: 2px solid var(--text-4); position: relative; z-index: 1; }
.hist-it.version .dot { border-color: var(--accent); background: var(--accent); }
.hist-it .k { font-family: var(--mono); font-size: var(--fs-1); color: var(--text-4); margin-left: 6px; }

/* DOCUMENTOS */
.doc-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 0; }
.doc-tab { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 4px 8px 0 0; border: 1px solid transparent; border-bottom: 0; font-family: var(--mono); font-size: var(--fs-1); color: var(--text-3); }
.doc-tab:hover { color: var(--text); }
.doc-tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--text); }
.doc-panel { border: 1px solid var(--line); border-radius: 0 var(--r) var(--r) var(--r); background: var(--surface); }
.doc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: var(--fs-1); color: var(--text-3); }
.doc-meta .chip { font-family: var(--mono); font-size: var(--fs-1); }
.md { padding: 10px 28px 24px; font-size: var(--fs-1); line-height: 1.65; color: var(--text-2); max-height: 520px; overflow: auto; }
.md h1, .md h2, .md h3, .md h4 { color: var(--text); letter-spacing: -.01em; line-height: 1.3; margin: 1.2em 0 .4em; }
.md h1 { font-size: var(--fs-4); } .md h2 { font-size: var(--fs-3); } .md h3, .md h4 { font-size: var(--fs-1); }
.md p { margin: .5em 0; } .md strong { color: var(--text); }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md li.n1 { margin-left: 1.2em; } .md li.n2 { margin-left: 2.4em; }
.md li.ck { list-style: none; position: relative; margin-left: -1.2em; padding-left: 1.5em; }
.md li.ck::before { content: ''; position: absolute; left: 0; top: .45em; width: 11px; height: 11px; border-radius: 2px; border: 1.5px solid var(--line-3); }
.md li.ck.ok::before { background: var(--accent); border-color: var(--accent); }
.md li.ck.ok { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }
.md li.ck.wip::before { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.md code { font-family: var(--mono); padding: 1px 5px; border-radius: 2px; background: var(--surface-2); color: var(--text); }
.md pre { padding: 12px 14px; border-radius: 4px; background: var(--surface-2); overflow: auto; }
.md pre code { padding: 0; background: none; }
.md table { border-collapse: collapse; width: 100%; font-size: var(--fs-1); margin: .6em 0; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.md th { color: var(--text); font-weight: 700; background: var(--surface-2); }
.md blockquote { margin: .6em 0; padding: 4px 12px; border-left: 2px solid var(--accent-line); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .md-a { color: var(--accent); }
.fm-tbl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 12px 0 6px; padding: 10px 12px; border-radius: 4px; background: var(--surface-2); font-family: var(--mono); font-size: var(--fs-1); }
.fm-tbl dt { color: var(--text-3); } .fm-tbl dd { margin: 0; color: var(--text); }
.d-empty { padding: 16px 18px; border-radius: var(--r); border: 1px dashed var(--line-2); color: var(--text-3); font-size: var(--fs-1); font-style: italic; display: flex; gap: 10px; align-items: center; }

/* Tooltip */
.tip { position: fixed; z-index: 90; max-width: 300px; padding: 7px 10px; border-radius: 4px; background: var(--text); color: var(--bg); font-size: var(--fs-1); line-height: 1.4; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--t-fast), transform var(--t-fast); box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .5); }
.tip.on { opacity: 1; transform: none; }
.tip b { font-weight: 700; }
.tip .src { display: block; margin-top: 3px; font-family: var(--mono); font-size: var(--fs-1); opacity: .65; }

/* ============================================================
   RESPONSIVE (desktop > laptop > tablet)
   ============================================================ */
@media (max-width: 1700px) {
  .pano-row { grid-template-columns: 44px minmax(210px, 1.4fr) 112px 120px minmax(190px, 1.5fr) 64px 128px 84px 84px; }
  .pano-row .c-act { display: none; }
}
@media (max-width: 1440px) {
  :root { --sidebar: 232px; }
  .pano-row { grid-template-columns: 44px minmax(200px, 1.4fr) 112px 120px minmax(180px, 1.5fr) 64px 128px 84px; column-gap: 14px; }
  .pano-row .c-last { display: none; }
  .overview { grid-template-columns: 1fr 1.4fr; }
  .overview .ov-attn { display: none; }
}
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .sidebar.show { display: block; position: fixed; left: 0; top: var(--top-h); bottom: 0; width: 290px; z-index: 35; background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow-drawer); }
  .brand { min-width: 0; } .stamp .when { display: none; }
  .pano-row { grid-template-columns: 44px minmax(200px, 1.5fr) 112px 120px minmax(170px, 1.4fr) 64px 84px; }
  .pano-row .c-bl { display: none; }
  .filters-btn { display: grid !important; }
  .views .k { display: none; }
}
@media (max-width: 860px) {
  .overview { grid-template-columns: 1fr; } .ov-block + .ov-block { border-left: 0; border-top: 1px solid var(--line); }
  .pano-row { grid-template-columns: 44px minmax(160px, 1fr) 120px 64px; }
  .pano-row .c-fase, .pano-row .c-next, .pano-row .c-sig { display: none; }
  .tiles, .bl-sum { grid-template-columns: 1fr; }
  .views button span { display: none; }
}
.filters-btn { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

dad de quién registró qué y cuándo. ## Funcionalidades - Formularios configurables por tipo de visita. - Captura de fotos con compresión en el dispositivo. - Cola de sincronización con reintentos. - Modo lectura de visitas anteriores del mismo lugar. ## Tecnologías React 18, TypeScript, IndexedDB (vía Dexie), Workbox para el service worker. El backend de sincronización es faro-api. ## Cómo correr `` npm install npm run dev ``"},{"archivo":"ESTADO.md","tipo":"estado","roles":["estado","funciona","falta","inmediato","bloqueos","historial"],"lineas":41,"html":"<h2>En qué vamos<\/h2>\n<p>La captura offline ya es estable en Android. El foco de las últimas semanas es la cola de sincronización: los reintentos funcionan, pero los conflictos cuando dos personas editan la misma visita todavía se resuelven a mano.<\/p>\n<h2>Qué funciona<\/h2>\n<ul><li class=\" n0\">Formularios dinámicos con validación.<\/li><li class=\" n0\">Fotos comprimidas a menos de 400 KB.<\/li><li class=\" n0\">Instalación como app en Android y escritorio.<\/li><\/ul>\n<h2>Qué falta<\/h2>\n<ul><li class=\" n0\">Resolución de conflictos de sincronización.<\/li><li class=\" n0\">Pruebas en iOS (Safari limita el almacenamiento).<\/li><\/ul>\n<h2>Próximo paso<\/h2>\n<p>Implementar la estrategia de conflictos &quot;última escritura gana con registro de versiones&quot; y probarla con dos dispositivos.<\/p>\n<h2>Bloqueantes<\/h2>\n<p>ninguno<\/p>\n<h2>Bitácora<\/h2>\n<ul><li class=\" n0\">2026-09-29: cola de sincronización con reintentos exponenciales.<\/li><li class=\" n0\">2026-09-22: compresión de fotos en un web worker.<\/li><li class=\" n0\">2026-09-10: formularios dinámicos desde JSON de configuración.<\/li><li class=\" n0\">2026-08-28: primera instalación como PWA en terreno.<\/li><li class=\" n0\">2026-08-14: piloto con tres personas del equipo.<\/li><\/ul>","texto":"## En qué vamos La captura offline ya es estable en Android. El foco de las últimas semanas es la cola de sincronización: los reintentos funcionan, pero los conflictos cuando dos personas editan la misma visita todavía se resuelven a mano. ## Qué funciona - Formularios dinámicos con validación. - Fotos comprimidas a menos de 400 KB. - Instalación como app en Android y escritorio. ## Qué falta - Resolución de conflictos de sincronización. - Pruebas en iOS (Safari limita el almacenamiento). ## Próximo paso Implementar la estrategia de conflictos \"última escritura gana con registro de versiones\" y probarla con dos dispositivos. ## Bloqueantes ninguno ## Bitácora - 2026-09-29: cola de sincronización con reintentos exponenciales. - 2026-09-22: compresión de fotos en un web worker. - 2026-09-10: formularios dinámicos desde JSON de configuración. - 2026-08-28: primera instalación como PWA en terreno. - 2026-08-14: piloto con tres personas del equipo."},{"archivo":"TODO.md","tipo":"todo","roles":["inmediato"],"lineas":15,"html":"<h1>TODO<\/h1>\n<h2>Ahora<\/h2>\n<ul><li class=\"ck n0\">Estrategia de conflictos de sincronización [P1]<\/li><li class=\"ck n0\">Prueba con dos dispositivos editando la misma visita [P1]<\/li><li class=\"ck n0\">Indicador visible de &quot;pendiente de sincronizar&quot; [P2]<\/li><li class=\"ck wip n0\">Migrar formularios antiguos al nuevo esquema JSON [P2]<\/li><li class=\"ck n0\">Revisar límites de almacenamiento en Safari iOS [P3]<\/li><\/ul>\n<h2>Hecho<\/h2>\n<ul><li class=\"ck ok n0\">Reintentos exponenciales en la cola (2026-09-29)<\/li><li class=\"ck ok n0\">Web worker para comprimir fotos (2026-09-22)<\/li><li class=\"ck ok n0\">Validación de campos obligatorios (2026-09-10)<\/li><\/ul>","texto":"# TODO ## Ahora - [ ] Estrategia de conflictos de sincronización [P1] - [ ] Prueba con dos dispositivos editando la misma visita [P1] - [ ] Indicador visible de \"pendiente de sincronizar\" [P2] - [/] Migrar formularios antiguos al nuevo esquema JSON [P2] - [ ] Revisar límites de almacenamiento en Safari iOS [P3] ## Hecho - [x] Reintentos exponenciales en la cola (2026-09-29) - [x] \/th><th>Descripción<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td>/indicadores<\/td><td>Lista de indicadores disponibles<\/td><\/tr><tr><td>GET<\/td><td>/indicadores/{id}/serie<\/td><td>Serie temporal de un indicador<\/td><\/tr><tr><td>POST<\/td><td>/visitas<\/td><td>Recibe visitas sincronizadas desde Bitácora<\/td><\/tr><\/tbody><\/table>","texto":"# Faro API Backend REST que expone indicadores consolidados (asistencia, matrícula, resultados) a las aplicaciones del equipo. Es la fuente única de datos para bitacora, vitrina y relevo. ## Arquitectura - R con plumber para los endpoints. - PostgreSQL como almacén de indicadores precalculados. - Contenedor Docker desplegado detrás de un proxy interno. - Autenticación por token de servicio. ## Endpoints principales | Método | Ruta | Descripción | |---|---|---| | GET | /indicadores | Lista de indicadores disponibles | | GET | /indicadores/{id}/serie | Serie temporal de un indicador | | POST | /visitas | Recibe visitas sincronizadas desde Bitácora |"},{"archivo":"ESTADO.md","tipo":"estado","roles":["estado","funciona","falta","inmediato","bloqueos","historial"],"lineas":40,"html":"<h2>En qué vamos<\/h2>\n<p>Los endpoints de lectura están listos y probados contra una base local. El despliegue al servidor institucional está detenido: falta la credencial de la base de producción y la apertura del puerto en el firewall.<\/p>\n<h2>Qué funciona<\/h2>\n<ul><li class=\" n0\">GET de indicadores y series con paginación.<\/li><li class=\" n0\">Pruebas automáticas de los endpoints de lectura.<\/li><\/ul>\n<h2>Qué falta<\/h2>\n<ul><li class=\" n0\">POST de visitas (lo necesita Bitácora).<\/li><li class=\" n0\">Despliegue en el servidor institucional.<\/li><\/ul>\n<h2>Próximo paso<\/h2>\n<p>Pedir por escrito a Infraestructura la credencial de solo lectura de producción y la apertura del puerto 8443, con fecha comprometida.<\/p>\n<h2>Bloqueantes<\/h2>\n<ul><li class=\" n0\">Credencial de la base de producción solicitada el 2026-09-02, sin respuesta.<\/li><li class=\" n0\">Puerto 8443 cerrado en el firewall del servidor institucional.<\/li><\/ul>\n<h2>Bitácora<\/h2>\n<ul><li class=\" n0\">2026-09-24: pruebas de carga de los endpoints de series.<\/li><li class=\" n0\">2026-09-12: paginación por cursor.<\/li><li class=\" n0\">2026-09-02: solicitud de credenciales a Infraestructura.<\/li><li class=\" n0\">2026-08-20: esquema de indicadores precalculados.<\/li><\/ul>","texto":"## En qué vamos Los endpoints de lectura están listos y probados contra una base local. El despliegue al servidor institucional está detenido: falta la credencial de la base de producción y la apertura del puerto en el firewall. ## Qué funciona - GET de indicadores y series con paginación. - Pruebas automáticas de los endpoints de lectura. ## Qué falta - POST de visitas (lo necesita Bitácora). - Despliegue en el servidor institucional. ## Próximo paso Pedir por escrito a Infraestructura la credencial de solo lectura de producción y la apertura del puerto 8443, con fecha comprometida. ## Bloqueantes - Credencial de la base de producción solicitada el 2026-09-02, sin respuesta. - Puerto 8443 cerrado en el firewall del servidor institucional. ## Bitácora - 2026-09-24: pruebas de carga de los endpoints de series. - 2026-09-12: paginación por cursor. - 2026-09-02: solicitud de credenciales a Infraestructura. - 2026-08-20: esquema de indicadores precalculados."},{"archivo":"TODO.md","tipo":"todo","roles":["inmediato"],"lineas":8,"html":"<h1>Pendientes<\/h1>\n<ul><li class=\"ck n0\">Endpoint POST /visitas con validación de esquema [P1]<\/li><li class=\"ck n0\">Reintentar solicitud de credenciales a Infraestructura [P1] (bloqueado)<\/li><li class=\"ck n0\">Desplegar contenedor en el servidor institucional (bloqueado)<\/li><li class=\"ck n0\">Documentar autenticación por token [P2]<\/li><li class=\"ck ok n0\">Paginación por cursor (2026-09-12)<\/li><li class=\"ck ok n0\">Pruebas de carga de series (2026-09-24)<\/li><\/ul>","texto":"# Pe <script>
(() => {
'use strict';

/* ============================================================
   DATA
   ============================================================ */
const DATA = JSON.parse(document.getElementById('portafolio-datos').textContent);

/* ============================================================
   LOGIC (puro: sin DOM)
   ============================================================ */
const TAX = DATA.taxonomias;
const PULSOS = TAX.pulso;
const PULSO = Object.fromEntries(PULSOS.map(p => [p.id, p]));
const FASES = TAX.fase.map(f => f.id);
const FASE_LBL = Object.fromEntries(TAX.fase.map(f => [f.id, f.etiqueta]));
const CAT_ITEM = Object.fromEntries(TAX.categoria_item.map(c => [c.id, c.etiqueta]));
const PRIO_LBL = { alta: 'Alta', media: 'Media', baja: 'Baja', sin: 'Sin prioridad' };
const PRIO_ORD = { alta: 0, media: 1, baja: 2, sin: 3 };
const SEV_ORD = { atencion: 0, aviso: 1, info: 2 };
const REF = new Date(DATA.fecha_ref + 'T12:00:00');
const DAY = 864e5;

const val = c => (c && c.valor != null ? c.valor : null);
const norm = s => (s == null ? '' : String(s)).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fecha = s => new Date(s + 'T12:00:00');
const diasDesde = s => (s ? Math.round((REF - fecha(s)) / DAY) : null);
const nivelDe = it => (it.prioridad && it.prioridad.nivel) || 'sin';
const abierto = it => ['pendiente', 'en_curso', 'bloqueado'].includes(it.estado);

function modelo(p) {
  const items = p.items || [];
  const inm = items.filter(i => i.horizonte === 'inmediato');
  const fut = items.filter(i => i.horizonte === 'futuro');
  const senales = [...(p.senales || [])].sort((a, b) => SEV_ORD[a.severidad] - SEV_ORD[b.severidad]);
  const pulso = val(p.pulso) || 'desconocido';
  const fase = val(p.fase);
  const tecs = (p.tecnologias && p.tecnologias.valores) || [];
  const docsTxt = (p.documentos || []).map(d => d.texto).join(' ');
  return {
    raw: p, id: p.id,
    nombre: val(p.nombre) || p.id,
    desc: val(p.descripcion),
    pulso, fase, faseIdx: fase ? FASES.indexOf(fase) : -1,
    categoria: val(p.categoria),
    prioridad: val(p.prioridad),
    tecs, tags: p.tags || [],
    ult: val(p.ultima_actividad),
    dias: diasDesde(val(p.ultima_actividad)),
    avance: p.avance,
    avanceNum: p.avance && p.avance.valor != null ? p.avance.valor : null,
    inm, fut,
    inmAb: inm.filter(abierto), futAb: fut.filter(abierto),
    senales,
    sevMax: senales.length ? SEV_ORD[senales[0].severidad] : 9,
    act: p.actividad || [],
    act12: (p.actividad || []).slice(-12).reduce((a, b) => a + b, 0),
    sinFechas: !(p.eventos && p.eventos.length) && !val(p.ultima_actividad),
    idx: {
      'Nombre': norm(val(p.nombre) + ' ' + p.id),
      'Descripción': norm(val(p.descripcion)),
      'Tecnologías': norm(tecs.join(' ')),
      'Tags': norm((p.tags || []).join(' ') + ' ' + (val(p.categoria) || '')),
      'Estado': norm([PULSO[pulso].etiqueta, fase ? FASE_LBL[fase] : '', val(p.resumen)].join(' ')),
      'Ahora': norm(inm.map(i => i.texto).join(' ') + ' ' + (val(p.proximo_paso) || '')),
      'Backlog': norm(fut.map(i => i.texto).join(' ')),
      'Roadmap': norm((p.hitos || []).map(h => h.nombre + ' ' + h.items.map(i => i.texto).join(' ')).join(' ')),
      'Documentos': norm(docsTxt)
    }
  };
}
const PROY = DATA.proyectos.map(modelo);
const BY_ID = Object.fromEntries(PROY.map(p => [p.id, p]));

/** Busqueda: todos los terminos deben aparecer; devuelve los campos que coinciden. */
function coincide(p, tokens) {
  if (!tokens.length) return [];
  const hits = new Set();
  for (const t of tokens) {
    let ok = false;
    for (const [campo, txt] of Object.entries(p.idx)) if (txt.includes(t)) { hits.add(campo); ok = true; }
    if (!ok) return null;
  }
  return [...hits];
}

const FACETAS = {
  pulso:      { titulo: 'Estado',     de: p => [p.pulso] },
  fase:       { titulo: 'Fase',       de: p => [p.fase || 'sin_fase'] },
  categoria:  { titulo: 'Categoría',  de: p => [p.categoria || 'sin_categoria'] },
  tecnologia: { titulo: 'Tecnología', de: p => p.tecs.length ? p.tecs : ['sin_dato'] },
  prioridad:  { titulo: 'Prioridad',  de: p => [p.prioridad || 'sin_dato'] },
  senal:      { titulo: 'Señales',    de: p => p.senales.length ? [...new Set(p.senales.map(s => s.severidad))] : ['ninguna'] }
};
const ETIQ_FACETA = {
  sin_fase: 'Sin fase', sin_categoria: 'Sin categoría', sin_dato: 'Sin dato', ninguna: 'Sin señales',
  atencion: 'Requieren atención', aviso: 'Avisos', info: 'Informativas', alta: 'Alta', media: 'Media', baja: 'Baja'
};
const etiquetaFaceta = (k, v) => k === 'pulso' ? PULSO[v].etiqueta : k === 'fase' && FASE_LBL[v] ? FASE_LBL[v] : (ETIQ_FACETA[v] || v);

function pasa(p, S, excepto) {
  if (S.soloFav && !S.favoritos.includes(p.id)) return false;
  for (const k of Object.keys(FACETAS)) {
    if (k === excepto) continue;
    const sel = S.filtros[k];
    if (sel && sel.length && !FACETAS[k].de(p).some(v => sel.includes(v))) return false;
  }
  return true;
}

const ORDENES = {
  relevancia: { lbl: 'Relevancia', f: (a, b, S) => (S.favoritos.includes(b.id) - S.favoritos.includes(a.id)) || (a.sevMax - b.sevMax) || cmpNull(a.dias, b.dias) },
  nombre:     { lbl: 'Nombre', f: (a, b) => a.nombre.localeCompare(b.nombre, 'es') },
  actividad:  { lbl: 'Actividad reciente', f: (a, b) => cmpNull(a.dias, b.dias) },
  progreso:   { lbl: 'Progreso', f: (a, b) => cmpNull(b.avanceNum, a.avanceNum) },
  prioridad:  { lbl: 'Prioridad', f: (a, b) => cmpNull(PRIO_ORD[a.prioridad], PRIO_ORD[b.prioridad]) },
  pendientes: { lbl: 'Tareas inmediatas', f: (a, b) => b.inmAb.length - a.inmAb.length },
  backlog:    { lbl: 'Tamaño del backlog', f: (a, b) => b.futAb.length - a.futAb.length },
  fase:       { lbl: 'Fase', f: (a, b) => cmpNull(b.faseIdx < 0 ? null : b.faseIdx, a.faseIdx < 0 ? null : a.faseIdx) }
};
/** Los valores sin dato van siempre al final. */
function cmpNull(a, b) {
  const na = a == null, nb = b == null;
  if (na && nb) return 0; if (na) return 1; if (nb) return -1;
  return a < b ? -1 : a > b ? 1 : 0;
}

const AGRUPAR = {
  pulso:     { lbl: 'Estado', clave: p => p.pulso, orden: PULSOS.map(p => p.id), titulo: k => PULSO[k].etiqueta },
  fase:      { lbl: 'Fase', clave: p => p.fase || 'sin_fase', orden: [...FASES].reverse().concat('sin_fase'), titulo: k => FASE_LBL[k] || 'Sin fase' },
  categoria: { lbl: 'Categoría', clave: p => p.categoria || 'Sin categoría', orden: null, titulo: k => k },
  ninguno:   { lbl: 'Sin agrupar', clave: () => '_', orden: ['_'], titulo: () => '' }
};

function consulta(S) {
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  const out = [];
  for (const p of PROY) {
    const hits = coincide(p, tokens);
    if (hits === null) continue;
    if (!pasa(p, S)) continue;
    out.push({ p, hits });
  }
  const f = ORDENES[S.orden].f;
  out.sort((a, b) => f(a.p, b.p, S) || a.p.nombre.localeCompare(b.p.nombre, 'es'));
  return { lista: out, tokens };
}

/* ============================================================
   STATE (preferencias en localStorage)
   ============================================================ */
const KEY = 'portafolio:prefs';
const DEF = { tema: 'light', vista: 'panorama', densidad: 'comoda', detalle: 'estandar', orden: 'relevancia', agrupar: 'pulso',
  filtros: { pulso: [], fase: [], categoria: [], tecnologia: [], prioridad: [], senal: [] }, favoritos: [], soloFav: false, mapaTec: false, verMas: {} };
const S = (() => {
  let g = {};
  try { g = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  const s = Object.assign({}, DEF, g);
  s.filtros = Object.assign({}, DEF.filtros, g.filtros || {});
  if (!ORDENES[s.orden]) s.orden = 'relevancia';
  if (!AGRUPAR[s.agrupar]) s.agrupar = 'pulso';
  s.q = ''; s.abierto = null; s.blCat = null; s.verHechas = false; s.docSel = 0; s.blTodo = false;
  return s;
})();
function guardar() {
  const { tema, vista, densidad, detalle, orden, agrupar, filtros, favoritos, soloFav, mapaTec } = S;
  try { localStorage.setItem(KEY, JSON.stringify({ tema, vista, densidad, detalle, orden, agrupar, filtros, favoritos, soloFav, mapaTec })); } catch (e) {}
}

/* ============================================================
   UI: utilidades
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmtFecha = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtCorta = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' });
const fFecha = s => (s ? fmtFecha.format(fecha(s)).replace('.', '') : '');
const fCorta = s => (s ? fmtCorta.format(fecha(s)).replace('.', '') : '');
function relativo(d) {
  if (d == null) return 'sin dato';
  if (d <= 0) return 'hoy'; if (d === 1) return 'ayer';
  if (d < 14) return `hace ${d} d`; if (d < 60) return `hace ${Math.round(d / 7)} sem`;
  if (d < 365) return `hace ${Math.round(d / 30)} meses`;
  const a = Math.round(d / 365); return `hace ${a} año${a > 1 ? 's' : ''}`;
}
/** Resalta terminos sin romper el escapado (norm conserva el largo para texto NFC). */
function hl(text, tokens) {
  if (text == null) return '';
  const s = String(text);
  if (!tokens || !tokens.length) return esc(s);
  const n = norm(s);
  if (n.length !== s.length) return esc(s);
  const marks = [];
  for (const t of tokens) { let i = n.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } }
  if (!marks.length) return esc(s);
  marks.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of marks) { if (a < pos) continue; out += esc(s.slice(pos, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(s.slice(pos));
}
const fuenteTxt = c => {
  if (!c) return '';
  if (c.origen === 'ausente') return 'No documentado' + (c.motivo === 'documento_ausente' ? ' (documento ausente)' : '');
  const f = c.fuente ? `${c.fuente.doc}${c.fuente.seccion ? ' › ' + c.fuente.seccion : ''}${c.fuente.linea ? ' · L' + c.fuente.linea : ''}` : '';
  return c.origen === 'inferido' ? `Inferido${c.regla ? ': ' + c.regla : ''}${f ? ' · ' + f : ''}` : `Declarado${f ? ' en ' + f : ''}`;
};
const srcAttr = c => `data-tip-src="${esc(fuenteTxt(c))}"`;

/* ============================================================
   UI: glifos
   ============================================================ */
function pulseDot(p) {
  const stale = p.pulso === 'activo' && p.dias != null && p.dias > DATA.umbrales.sin_actividad_aviso;
  return `<span class="pulse p-${p.pulso}${stale ? ' stale' : ''}" data-tip="${esc(PULSO[p.pulso].etiqueta)}" data-tip-src="${esc(fuenteTxt(p.raw.pulso))}"></span>`;
}
function pulsePill(p) {
  return `<span class="pill p-${p.pulso}" ${srcAttr(p.raw.pulso)} data-tip="Estado: ${esc(PULSO[p.pulso].etiqueta)}"><span class="pulse p-${p.pulso}"></span>${esc(PULSO[p.pulso].etiqueta)}</span>`;
}
function steps(p) {
  const cls = p.faseIdx < 0 ? 'unknown' : p.pulso === 'cerrado' ? 'closed' : '';
  let s = '';
  FASES.forEach((f, i) => { s += `<i class="${i < p.faseIdx ? 'on' : i === p.faseIdx ? 'cur' : ''}"></i>`; });
  return `<span class="steps ${cls}">${s}</span>`;
}
function faseCell(p) {
  const tip = p.faseIdx < 0 ? 'Fase no documentada' : `Fase: ${FASE_LBL[p.fase]} (${p.faseIdx + 1} de ${FASES.length})`;
  return `<div class="fase-cell" data-tip="${esc(tip)}" ${srcAttr(p.raw.fase)}>${steps(p)}<span class="lbl ${p.faseIdx < 0 ? 'none' : ''} ${p.raw.fase.origen === 'inferido' ? 'src-inferido' : ''}">${p.faseIdx < 0 ? 'sin fase' : esc(FASE_LBL[p.fase])}</span></div>`;
}
function progBar(p) {
  const a = p.avance;
  const closed = p.pulso === 'cerrado' ? ' closed' : '';
  if (a.tipo === 'declarado') {
    const src = a.fuente ? `Declarado en ${a.fuente.doc} › ${a.fuente.seccion}` : 'Declarado';
    return `<div class="prog${closed}" data-tip="Avance ${Math.round(a.valor * 100)}%" data-tip-src="${esc(src)}"><div class="track"><div class="fill" style="--p:${a.valor}"></div></div><div class="meta"><b>${Math.round(a.valor * 100)}%</b><span class="how">declarado</span></div></div>`;
  }
  if (a.tipo === 'hitos') {
    const hs = p.raw.hitos;
    const segs = hs.map((h, k) => `<i class="${h.estado === 'hecho' ? 'on' : h.estado === 'en_curso' ? 'half' : ''}" style="--k:${k}"></i>`).join('');
    return `<div class="prog${closed}" data-tip="${a.hechos} de ${a.total} fases del roadmap completadas" data-tip-src="Calculado desde ${esc(a.fuente ? a.fuente.doc : 'ROADMAP')}"><div class="segs">${segs}</div><div class="meta"><b>${a.hechos}/${a.total}</b><span class="how">fases</span></div></div>`;
  }
  const txt = a.tipo === 'fase' ? 'solo fase' : 'no documentado';
  return `<div class="prog" data-tip="${a.tipo === 'fase' ? 'Sin porcentaje ni roadmap: solo se conoce la fase' : 'Avance no documentado'}"><div class="dash"></div><div class="meta"><span class="src-ausente">${txt}</span></div></div>`;
}
function heat(p) {
  if (p.sinFechas) return `<div class="heat none" data-tip="Sin fuentes con fecha"></div>`;
  const cells = p.act.map((n, i) => `<i class="${n >= 3 ? 'l3' : n === 2 ? 'l2' : n === 1 ? 'l1' : ''}"></i>`).join('');
  return `<div class="heat" data-tip="${p.act.reduce((a, b) => a + b, 0)} eventos documentados en 26 semanas">${cells}</div>`;
}
function backlogStrip(p, max = 30) {
  const its = [...p.futAb].sort((a, b) => PRIO_ORD[nivelDe(a)] - PRIO_ORD[nivelDe(b)]);
  if (!its.length) return `<div class="strip" data-tip="${p.fut.length ? 'Backlog sin elementos abiertos' : 'Sin backlog documentado'}"><span class="muted" style="font-size: var(--fs-1)">—</span></div>`;
  const m = p.raw.metricas.futuro_prioridad;
  const tip = `${its.length} en backlog · alta ${m.alta} · media ${m.media} · baja ${m.baja} · sin prioridad ${m.sin}`;
  return `<div class="strip" data-tip="${esc(tip)}">${its.slice(0, max).map(i => `<i class="p-${nivelDe(i)}"></i>`).join('')}${its.length > max ? `<span class="more">+${its.length - max}</span>` : ''}</div>`;
}
function waffle(p, max = 48) {
  const its = [...p.futAb].sort((a, b) => PRIO_ORD[nivelDe(a)] - PRIO_ORD[nivelDe(b)]);
  if (!its.length) return `<span class="muted" style="font-size: var(--fs-1)">sin backlog</span>`;
  return `<div class="waffle">${its.slice(0, max).map(i => `<i class="p-${nivelDe(i)}"></i>`).join('')}</div>${its.length > max ? `<span class="more mono muted" style="font-size: var(--fs-1)">+${its.length - max}</span>` : ''}`;
}
function prio(n) { const lv = { alta: 3, media: 2, baja: 1 }[n] || 0; return `<span class="prio lv${lv}" data-tip="Prioridad: ${esc(PRIO_LBL[n] || 'sin prioridad')}"><i></i><i></i><i></i></span>`; }
const ICONO_SENAL = { bloqueos: 'octagon-x', abandono: 'clock', sin_actividad: 'clock', pausa_prolongada: 'pause', contradiccion_pulso: 'circle-alert',
  contradiccion_fase: 'circle-alert', sin_estado: 'circle-dashed', sin_proximo_paso: 'target', todo_extenso: 'layers', backlog_grande: 'layers',
  backlog_sin_prioridad: 'sliders-horizontal', hito_vencido: 'flag', doc_incompleta: 'file-text' };
function sigIcons(p, max = 3) {
  if (!p.senales.length) return '';
  return `<span class="sigs">${p.senales.slice(0, max).map(s => `<span class="sig ${s.severidad}" data-tip="<b>${esc(s.titulo)}</b>" data-tip-src="${esc(s.evidencia)}" data-html="1">${icon(ICONO_SENAL[s.id] || 'circle-alert', 'sm')}</span>`).join('')}${p.senales.length > max ? `<span class="mono muted" style="font-size: var(--fs-1)">+${p.senales.length - max}</span>` : ''}</span>`;
}
function ring(p, size = 58) {
  const a = p.avance, r = size / 2 - 5, c = 2 * Math.PI * r, cx = size / 2;
  const closed = p.pulso === 'cerrado' ? ' closed' : '';
  const sw = size > 70 ? 6 : 4.5;
  let inner = '', txt = '', sub = '';
  if (a.tipo === 'declarado') {
    inner = `<circle class="fg" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c * (1 - a.valor)}" transform="rotate(-90 ${cx} ${cx})"/>`;
    txt = Math.round(a.valor * 100) + '%'; sub = 'declarado';
  } else if (a.tipo === 'hitos') {
    const n = a.total, gap = 6, seg = c / n - gap;
    p.raw.hitos.forEach((h, k) => {
      const len = h.estado === 'hecho' ? seg : h.estado === 'en_curso' ? seg / 2 : 0;
      inner += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" class="bg" stroke-width="${sw}" stroke-dasharray="${seg} ${c - seg}" stroke-dashoffset="${-(k * (seg + gap))}" transform="rotate(-90 ${cx} ${cx})"/>`;
      if (len) inner += `<circle class="fg" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="butt" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-(k * (seg + gap))}" transform="rotate(-90 ${cx} ${cx})"/>`;
    });
    txt = `${a.hechos}/${a.total}`; sub = 'fases';
  } else {
    inner = `<circle class="dash" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="2"/>`;
    txt = '—'; sub = a.tipo === 'fase' ? 'solo fase' : 'sin dato';
  }
  const base = a.tipo === 'declarado' ? `<circle class="bg" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${sw}"/>` : '';
  const fs = size > 70 ? 24 : 14;
  return `<svg class="ring${closed}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${base}${inner}<text x="${cx}" y="${cx + (size > 70 ? 2 : 4)}" text-anchor="middle" font-size="${fs}">${txt}</text>${size > 70 ? `<text class="sub" x="${cx}" y="${cx + 20}" text-anchor="middle" font-size="14">${sub}</text>` : ''}</svg>`;
}
const favBtn = p => `<button class="fav${S.favoritos.includes(p.id) ? ' on' : ''}" data-fav="${esc(p.id)}" aria-label="Marcar ${esc(p.nombre)} como favorito" aria-pressed="${S.favoritos.includes(p.id)}">${icon('star', 'sm')}</button>`;
const proximoTxt = p => val(p.raw.proximo_paso);

function renderOverview(res) {
  const visibles = new Set(res.lista.map(r => r.p.id));
  const cuenta = id => PROY.filter(p => p.pulso === id).length;
  const chips = PULSOS.map(pu => {
    const n = cuenta(pu.id);
    return `<button class="pl-chip${n ? '' : ' zero'}" data-filter="pulso" data-v="${pu.id}" aria-pressed="${S.filtros.pulso.includes(pu.id)}"><span class="pulse p-${pu.id}"></span>${esc(pu.etiqueta)} <b>${n}</b></button>`;
  }).join('');
  const fCount = FASES.map(f => [f, PROY.filter(p => p.fase === f).length]);
  const sinFase = PROY.filter(p => !p.fase).length;
  const segs = fCount.filter(([, n]) => n).map(([f, n]) => `<span class="seg" style="flex:${n}" data-tip="${esc(FASE_LBL[f])}: ${n}" data-filter="fase" data-v="${f}"></span>`).join('') + (sinFase ? `<span class="seg f-unknown" style="flex:${sinFase}" data-tip="Sin fase: ${sinFase}"></span>` : '');
  const lbls = fCount.filter(([, n]) => n).map(([f, n]) => `<span>${esc(FASE_LBL[f])} <b>${n}</b></span>`).join('') + (sinFase ? `<span>Sin fase <b>${sinFase}</b></span>` : '');

  const sky = [...PROY].sort((a, b) => (PULSOS.findIndex(x => x.id === a.pulso) - PULSOS.findIndex(x => x.id === b.pulso)) || (b.act12 - a.act12));
  const maxA = Math.max(1, ...sky.map(p => p.act12));
  const bars = sky.map(p => {
    const h = p.sinFechas ? 26 : Math.max(5, Math.round(Math.sqrt(p.act12 / maxA) * 100));
    const col = { activo: 'var(--ok)', bloqueado: 'var(--block)', pausa: 'var(--pause)', cerrado: 'var(--closed)', desconocido: 'var(--text-4)' }[p.pulso];
    return `<button class="sky-bar${p.sinFechas ? ' none' : ''}${visibles.has(p.id) ? '' : ' dim'}" style="--c:${col};--h:${h}%;--k:${sky.indexOf(p)}" data-open="${esc(p.id)}" data-tip="<b>${esc(p.nombre)}</b> · ${esc(PULSO[p.pulso].etiqueta)}" data-tip-src="${p.sinFechas ? 'sin fuentes con fecha' : p.act12 + ' eventos en 12 semanas · última actividad ' + relativo(p.dias)}" data-html="1" aria-label="${esc(p.nombre)}"><span class="fill" style="height:${h}%"></span></button>`;
  }).join('');

  const att = PROY.filter(p => p.senales.some(s => s.severidad !== 'info')).sort((a, b) => a.sevMax - b.sevMax || b.senales.length - a.senales.length).slice(0, 4);
  const attHtml = att.length ? att.map(p => {
    const s = p.senales[0];
    return `<button class="attn-item" data-open="${esc(p.id)}"><span class="sig ${s.severidad}">${icon(ICONO_SENAL[s.id] || 'circle-alert', 'sm')}</span><span><span class="t">${esc(p.nombre)}</span><br><span class="s">${esc(s.titulo)}${p.senales.length > 1 ? ` · +${p.senales.length - 1}` : ''}</span></span></button>`;
  }).join('') : `<div class="attn-empty">Ninguna señal de atención o aviso.</div>`;
  const nAtt = PROY.filter(p => p.senales.some(s => s.severidad === 'atencion')).length;
  const nAv = PROY.filter(p => !p.senales.some(s => s.severidad === 'atencion') && p.senales.some(s => s.severidad === 'aviso')).length;

  $('#overview').innerHTML = `
    <div class="ov-block">
      <div class="eyebrow">Datos al ${fFecha(DATA.fecha_ref)}</div>
      <div class="ov-total"><b class="num">${PROY.length}</b><span>proyectos</span></div>
      <div class="pulse-legend">${chips}</div>
      <div class="fase-dist"><div class="eyebrow">Ciclo de vida</div><div class="bar">${segs}</div><div class="lbls">${lbls}</div></div>
    </div>
    <div class="ov-block">
      <div class="eyebrow">Actividad documentada en las últimas 12 semanas, una barra por proyecto</div>
      <div class="skyline-wrap"><div class="skyline">${bars}</div><div class="sky-axis"><span>activos</span><span>bloqueados · en pausa · terminados · sin estado</span></div></div>
    </div>
    <div class="ov-block ov-attn">
      <div class="eyebrow">Requieren atención · ${nAtt} · con avisos · ${nAv}</div>
      <div class="attn-list">${attHtml}</div>
    </div>`;
}

function renderSidebar() {
  const base = PROY.filter(p => coincide(p, norm(S.q).split(/\s+/).filter(Boolean)) !== null);
  let html = '';
  for (const [k, fc] of Object.entries(FACETAS)) {
    const cont = new Map();
    for (const p of base) { if (!pasa(p, S, k)) continue; for (const v of fc.de(p)) cont.set(v, (cont.get(v) || 0) + 1); }
    let vals;
    if (k === 'pulso') vals = PULSOS.map(p => p.id);
    else if (k === 'fase') vals = [...FASES, 'sin_fase'];
    else if (k === 'prioridad') vals = ['alta', 'media', 'baja', 'sin_dato'];
    else if (k === 'senal') vals = ['atencion', 'aviso', 'info', 'ninguna'];
    else { const all = new Map(); PROY.forEach(p => fc.de(p).forEach(v => all.set(v, (all.get(v) || 0) + 1))); vals = [...all.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0], 'es')).map(e => e[0]); }
    vals = vals.filter(v => PROY.some(p => fc.de(p).includes(v)));
    const limite = k === 'tecnologia' && !S.verMas[k] ? 8 : 99;
    const opts = vals.slice(0, limite).map(v => {
      const n = cont.get(v) || 0, on = S.filtros[k].includes(v);
      const lead = k === 'pulso' ? `<span class="pulse p-${v}"></span>` : `<span class="box"></span>`;
      return `<button class="facet-opt${n || on ? '' : ' zero'}" data-filter="${k}" data-v="${esc(v)}" aria-pressed="${on}">${lead}<span class="lbl">${esc(etiquetaFaceta(k, v))}</span><span class="n">${n}</span></button>`;
    }).join('');
    const more = vals.length > limite ? `<button class="more" data-act="vermas" data-k="${k}">+ ${vals.length - limite} más</button>` : '';
    const clr = S.filtros[k].length ? `<button class="link-btn" data-act="clear-facet" data-k="${k}">limpiar</button>` : '';
    html += `<div class="facet"><h3>${fc.titulo}${clr}</h3>${opts}${more}</div>`;
  }
  html += `<div class="facet"><h3>Selección</h3><button class="facet-opt" data-act="solofav" aria-pressed="${S.soloFav}"><span class="box"></span><span class="lbl">Solo favoritos</span><span class="n">${S.favoritos.length}</span></button></div>`;
  html += `<div class="side-foot"><div><span class="kbd">/</span>buscar</div><div><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span>vistas</div><div><span class="kbd">J</span><span class="kbd">K</span>moverse · <span class="kbd">Enter</span>abrir</div><div><span class="kbd">F</span>favorito · <span class="kbd">T</span>tema</div><div style="margin-top:10px">Esquema <span class="mono">${esc(DATA.esquema)}</span><br>Fuente <span class="mono">${esc(DATA.fuente.raiz)}</span></div></div>`;
  $('#sidebar').innerHTML = html;
}

/* ============================================================
   UI: vista Panorama
   ============================================================ */
function filaPanorama(r, i, tokens) {
  const p = r.p, prox = proximoTxt(p);
  const lastStale = p.dias != null && p.dias > DATA.umbrales.sin_actividad_aviso && p.pulso !== 'cerrado';
  const hits = tokens.length ? `<div class="hits">coincide en: ${r.hits.join(' · ')}</div>` : '';
  const inmTip = `${p.inmAb.length} abiertas · ${p.raw.metricas.inmediato_hechos} hechas`;
  return `<article class="pano-row p-row${S.abierto === p.id ? ' sel' : ''}" style="--i:${i}" tabindex="0" data-open="${esc(p.id)}" data-nav aria-label="${esc(p.nombre)}">
    <div class="lead">${favBtn(p)}${pulseDot(p)}</div>
    <div><div class="name"><b>${hl(p.nombre, tokens)}</b><span class="id">${esc(p.id)}</span></div>
      <div class="desc ${p.desc ? '' : 'src-ausente'}">${p.desc ? hl(p.desc, tokens) : 'Sin descripción documentada'}</div>${hits}</div>
    <div class="c-fase">${faseCell(p)}</div>
    <div class="c-prog">${progBar(p)}</div>
    <div class="c-act act-cell">${heat(p)}<span class="lbl">${p.sinFechas ? 'sin fechas' : p.raw.metricas.eventos_90d + ' en 90 d'}</span></div>
    <div class="c-next"><div class="next ${prox ? '' : 'none'}" ${srcAttr(p.raw.proximo_paso)} data-tip="Próximo paso">${icon('corner-down-right', 'sm')}<span class="${prox ? (p.raw.proximo_paso.origen === 'inferido' ? 'src-inferido' : '') : 'src-ausente'}">${prox ? hl(prox, tokens) : 'Sin próximo paso documentado'}</span></div></div>
    <div class="todo-cell${p.inmAb.length ? '' : ' zero'}" data-tip="${esc(inmTip)}"><b>${p.inm.length ? p.inmAb.length : '—'}</b><span class="lbl">${p.inm.length ? 'ahora' : 'sin TODO'}</span></div>
    <div class="c-bl bl-cell">${backlogStrip(p, 20)}<span class="lbl"><b>${p.futAb.length || '—'}</b>${p.futAb.length ? 'backlog' : ''}</span></div>
    <div class="c-sig">${sigIcons(p)}</div>
    <div class="c-last last-cell${lastStale ? ' stale' : ''}" ${srcAttr(p.raw.ultima_actividad)} data-tip="${p.ult ? esc(fFecha(p.ult)) + ' · ' + relativo(p.dias) : 'Sin fecha documentada'}">${relativo(p.dias).replace('hace ', '')}<span class="lbl">${p.ult ? esc(fCorta(p.ult)) : ''}</span></div>
  </article>`;
}
function renderPanorama(res) {
  const { lista, tokens } = res;
  if (!lista.length) return vacio();
  const head = [['', ''], ['Proyecto', 'nombre'], ['Fase', 'fase', 'c-fase'], ['Progreso', 'progreso'], ['Actividad', 'actividad', 'c-act'], ['Próximo paso', ''], ['Ahora', 'pendientes'], ['Backlog', 'backlog', 'c-bl'], ['Señales', ''], ['Última', 'actividad', 'c-last r']];
  const hh = head.map(([l, o, cls]) => o ? `<span class="${cls || ''}"><button data-sort="${o}" class="${S.orden === o ? 'on' : ''}">${l}${S.orden === o ? icon('chevron-down', 'xs') : ''}</button></span>` : `<span class="${cls || ''} ${l === 'Señales' ? 'c-sig' : l === 'Próximo paso' ? 'c-next' : ''}">${l}</span>`).join('');
  const ag = AGRUPAR[S.agrupar];
  const grupos = new Map();
  lista.forEach(r => { const k = ag.clave(r.p); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); });
  const orden = ag.orden ? ag.orden.filter(k => grupos.has(k)) : [...grupos.keys()].sort((a, b) => a.localeCompare(b, 'es'));
  let i = 0, body = '';
  for (const k of orden) {
    if (S.agrupar !== 'ninguno') {
      const lead = S.agrupar === 'pulso' ? `<span class="pulse p-${k}"></span>` : '';
      body += `<div class="group-h">${lead}${esc(ag.titulo(k))}<span class="n">${grupos.get(k).length}</span><span class="rule"></span></div>`;
    }
    body += grupos.get(k).map(r => filaPanorama(r, i++, tokens)).join('');
  }
  return `<div class="pano density-${S.densidad === 'compacta' ? 'compact' : 'comfy'}"><div class="pano-row pano-head">${hh}</div>${body}</div>`;
}
function vacio() {
  return `<div class="pano empty">${icon('search')}<div>Ningún proyecto coincide con la búsqueda o los filtros.</div><button class="link-btn" style="margin-top:10px" data-act="clear-all">Limpiar filtros</button></div>`;
}

/* ============================================================
   UI: vista Proyectos (tarjetas)
   ============================================================ */

function bindMapa() {

    const vec = new Set([id]);
    aristas.forEach(e => { const on = !!id && (e.dataset.de === id || e.dataset.a === id); e.classList.toggle('hot', on); e.classList.toggle('cold', !on && !!id); if (on) { vec.add(e.dataset.de); vec.add(e.dataset.a); } });

  };
  nodos.forEach(n => { n.addEventListener('pointerenter', () => foco(n.dataset.node)); n.addEventListener('pointerleave', () => foco(null)); n.addEventListener('focus', () => foco(n.dataset.node)); n.addEventListener('blur', () => foco(null)); });

    aristas.forEach(el => { if (el.dataset.de === drag.p.id || el.dataset.a === drag.p.id) el.setAttribute('d', curva(LAYOUT.pix[el.dataset.de], LAYOUT.pix[el.dataset.a])); });
